<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#06080b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SimLab Pro" />
  <link rel="icon" type="image/jpeg" href="./icon-512.png.jpeg" />
  <link rel="apple-touch-icon" href="./icon-512.png.jpeg" />
  <link rel="manifest" href="./manifest.json" />
  <title>SimLab Pro | Quantitative Sports Terminal</title>
  <style>
    :root {
      --bg: #06080b;
      --surface: #0c1016;
      --surface-2: #111720;
      --surface-hover: #151d28;
      --border: #1a2330;
      --border-hi: #283548;
      --text: #f8fafc;
      --sub: #94a3b8;
      --muted: #64748b;
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.16);
      --cyan: #38bdf8;
      --cyan-glow: rgba(56, 189, 248, 0.14);
      --amber: #f59e0b;
      --amber-glow: rgba(245, 158, 11, 0.14);
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% -10%, #101926 0%, var(--bg) 48%);
      color: var(--text);
      line-height: 1.4;
      padding-bottom: 110px;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(6, 8, 11, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
    }

    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-avatar {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--emerald), #059669);
      border: 1px solid rgba(255, 255, 255, 0.15);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #03150a;
      flex-shrink: 0;
    }

    .brand-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .brand-name {
      font-size: 1.08rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .pro-tag {
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--emerald-glow);
      color: var(--emerald);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .telemetry-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 10px var(--emerald);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-util {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--sub);
      padding: 7px 13px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-util:hover { border-color: var(--border-hi); color: #fff; }

    /* Mode Switcher & Sub-Pills */
    .mode-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .segmented {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3px;
      border-radius: 10px;
      gap: 4px;
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: var(--sub);
      padding: 7px 14px;
      border-radius: 7px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.15s;
    }

    .seg-btn.active {
      background: var(--emerald);
      color: #03150a;
    }

    .seg-badge {
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.08);
      font-variant-numeric: tabular-nums;
    }

    .seg-btn.active .seg-badge {
      background: rgba(0, 0, 0, 0.22);
      color: #03150a;
    }

    .stat-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .stat-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--sub);
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .stat-chip.active {
      background: var(--cyan-glow);
      border-color: var(--cyan);
      color: var(--cyan);
    }

    /* AI Top 4-Leg Featured Parlay Banner */
    .hero-parlay {
      margin-top: 18px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.09) 0%, rgba(12, 16, 22, 0.96) 55%, rgba(56, 189, 248, 0.07) 100%);
      border: 1px solid rgba(16, 185, 129, 0.28);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hero-title {
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--emerald);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hero-legs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .hero-leg-card {
      background: rgba(6, 8, 11, 0.72);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 11px;
    }

    .hero-leg-pick {
      font-size: 0.82rem;
      font-weight: 700;
      color: #fff;
    }

    .hero-leg-meta {
      font-size: 0.7rem;
      color: var(--sub);
      display: flex;
      justify-content: space-between;
      margin-top: 3px;
    }

    .btn-load-parlay {
      background: var(--emerald);
      color: #03150a;
      border: none;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 800;
      cursor: pointer;
    }

    /* KPI Strip */
    .kpi-grid {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 13px 16px;
    }

    .kpi-lbl {
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .kpi-num {
      font-size: 1.35rem;
      font-weight: 800;
      margin-top: 3px;
      font-variant-numeric: tabular-nums;
    }

    /* Controls */
    .controls {
      margin: 14px 0 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 230px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 14px 10px 36px;
      border-radius: 9px;
      font-size: 0.84rem;
      outline: none;
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .sort-select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 9px;
      font-size: 0.84rem;
      outline: none;
      cursor: pointer;
    }

    /* Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 13px;
      transition: transform 0.12s, border-color 0.15s, background 0.15s;
    }

    .card:hover {
      border-color: var(--border-hi);
      background: var(--surface-hover);
    }

    .card.active-card {
      border-color: var(--emerald);
      box-shadow: 0 0 0 1px var(--emerald);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .title-main {
      font-size: 0.98rem;
      font-weight: 700;
      color: #fff;
    }

    .title-sub {
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 600;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .usg-pill {
      background: var(--amber-glow);
      color: var(--amber);
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.66rem;
      font-weight: 800;
    }

    .pill-stack {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }

    .mkt-badge {
      background: var(--surface-2);
      border: 1px solid var(--border-hi);
      color: var(--sub);
      font-size: 0.66rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 5px;
      letter-spacing: 0.05em;
    }

    .edge-pill {
      font-size: 0.71rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 5px;
      background: var(--emerald-glow);
      color: var(--emerald);
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-variant-numeric: tabular-nums;
    }

    /* Telemetry Metrics */
    .telemetry-trio {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: rgba(6, 8, 11, 0.65);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 12px;
    }

    .t-col:nth-child(2) { text-align: center; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
    .t-col:nth-child(3) { text-align: right; }

    .t-lbl {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .t-val {
      font-size: 1.18rem;
      font-weight: 800;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    /* Probability Bar */
    .prob-meter {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .meter-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .meter-track {
      height: 6px;
      background: #1a2332;
      border-radius: 999px;
      overflow: hidden;
      display: flex;
    }

    .meter-fill-over {
      background: linear-gradient(90deg, #059669, var(--emerald));
      height: 100%;
    }

    .meter-fill-under {
      background: linear-gradient(90deg, #0284c7, var(--cyan));
      height: 100%;
    }

    /* Action Buttons */
    .btn-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .pick-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--sub);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s;
      font-variant-numeric: tabular-nums;
    }

    .pick-btn:hover { border-color: var(--border-hi); color: #fff; }

    .pick-btn.sel-over {
      background: var(--emerald-glow);
      border-color: var(--emerald);
      color: #fff;
    }

    .pick-btn.sel-under {
      background: var(--cyan-glow);
      border-color: var(--cyan);
      color: #fff;
    }

    /* Kelly & Parlay Slip Dock */
    .slip-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(9, 12, 17, 0.96);
      border-top: 1px solid var(--border-hi);
      padding: 11px 0;
      z-index: 50;
      backdrop-filter: blur(14px);
    }

    .slip-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .slip-chips {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      flex: 1;
    }

    .chip {
      background: var(--surface-2);
      border: 1px solid var(--emerald);
      color: #fff;
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 0.73rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .chip button {
      background: none;
      border: none;
      color: var(--danger);
      font-weight: 900;
      cursor: pointer;
    }

    .kelly-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bankroll-input {
      width: 78px;
      background: var(--surface);
      border: 1px solid var(--border-hi);
      color: #fff;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      text-align: right;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 44px 20px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 12px;
      color: var(--muted);
    }

    @media (max-width: 1100px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .hero-legs { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 680px) {
      .grid { grid-template-columns: 1fr; }
      .hero-legs { grid-template-columns: 1fr; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="nav-row">
      <div class="brand">
        <div class="brand-avatar">
          <img src="./icon-512.png.jpeg" alt="SimLab" onerror="this.remove()" />
        </div>
        <div>
          <div class="brand-name">SimLab <span style="color:var(--sub); font-weight:500;">Terminal</span> <span class="pro-tag">10K MONTE CARLO</span></div>
          <div class="telemetry-bar">
            <span class="pulse-dot"></span>
            <span style="color:var(--emerald); font-weight:700;">LIVE</span>
            <span>•</span>
            <span id="lastSyncText">Syncing feeds...</span>
          </div>
        </div>
      </div>

      <div class="nav-actions">
        <button id="installBtn" class="btn-util" style="display:none; border-color:var(--emerald); color:var(--emerald);">📲 Install App</button>
        <button class="btn-util" onclick="loadAllData(true)">↻ Sync</button>
      </div>
    </div>

    <div class="mode-bar">
      <div class="segmented">
        <button class="seg-btn active" id="tabNba" onclick="switchSport('nba')">
          <span>🔥 NBA Player Props</span>
          <span class="seg-badge" id="nbaCount">0</span>
        </button>
        <button class="seg-btn" id="tabNcaa" onclick="switchSport('ncaa')">
          <span>🏀 NCAA D1 Slate</span>
          <span class="seg-badge" id="ncaaCount">0</span>
        </button>
      </div>

      <div class="stat-pills" id="statPills">
        <button class="stat-chip active" onclick="setStatFilter('ALL', this)">ALL MARKETS</button>
        <button class="stat-chip" onclick="setStatFilter('PTS', this)">POINTS</button>
        <button class="stat-chip" onclick="setStatFilter('REB', this)">REBOUNDS</button>
        <button class="stat-chip" onclick="setStatFilter('AST', this)">ASSISTS</button>
        <button class="stat-chip" onclick="setStatFilter('PRA', this)">PRA</button>
        <button class="stat-chip" onclick="setStatFilter('USG', this)">⚡ USAGE BUMPS</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- Featured AI 4-Leg Parlay Strip -->
  <section class="hero-parlay" id="heroParlay" style="display:none;">
    <div class="hero-top">
      <div class="hero-title">
        <span>🎯 AI Top 4-Leg Edge Parlay</span>
        <span id="heroOddsBadge" style="background:rgba(0,0,0,0.45); padding:2px 8px; border-radius:5px; color:#fff; font-size:0.74rem;">—</span>
      </div>
      <button class="btn-load-parlay" onclick="loadRecommendedParlay()">+ Load All 4 Legs to Slip</button>
    </div>
    <div class="hero-legs" id="heroLegsGrid"></div>
  </section>

  <!-- KPI Telemetry Strip -->
  <section class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-lbl" id="kpi1Lbl">NBA PROPS SIMULATED</div>
      <div class="kpi-num" id="kpi1Val">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-lbl">NCAA D1 SLATE</div>
      <div class="kpi-num" id="kpi2Val">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-lbl">AVG MODEL EDGE</div>
      <div class="kpi-num" style="color:var(--emerald);" id="kpi3Val">+0.0 pt</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-lbl">HIGH-CONFIDENCE (≥60%)</div>
      <div class="kpi-num" style="color:var(--cyan);" id="kpi4Val">0</div>
    </div>
  </section>

  <!-- Search & Sort Controls -->
  <section class="controls">
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="Search player, team, or matchup..." oninput="render()" />
    </div>

    <select id="sortSelect" class="sort-select" onchange="render()">
      <option value="edge">Sort: Largest Point Edge</option>
      <option value="prob">Sort: Highest Hit Probability %</option>
      <option value="slip">Filter: On My Slip Only</option>
    </select>
  </section>

  <!-- Cards Grid -->
  <section class="grid" id="cardsGrid"></section>
</main>

<!-- Sticky Bottom Slip & Kelly Sizing Dock -->
<div class="slip-dock">
  <div class="wrap slip-row">
    <div class="slip-chips" id="slipChips">
      <span style="font-size:0.76rem; font-weight:800; color:var(--emerald); letter-spacing:0.05em;">⚡ CROSS-SPORT SLIP:</span>
      <span style="font-size:0.78rem; color:var(--muted);">Tap any Over/Under or Spread button to build a parlay</span>
    </div>

    <div class="kelly-box">
      <div style="display:flex; align-items:center; gap:5px;">
        <span style="font-size:0.68rem; color:var(--muted); font-weight:700;">BANKROLL $</span>
        <input type="number" id="bankrollInput" class="bankroll-input" value="500" min="10" step="50" oninput="updateSlipUI()" />
      </div>
      <div style="text-align:right;">
        <div style="font-size:0.64rem; font-weight:700; color:var(--muted); letter-spacing:0.06em;">HIT RATE • ¼-KELLY BET</div>
        <div style="font-size:0.92rem; font-weight:800; color:var(--emerald); font-variant-numeric:tabular-nums;" id="slipMetrics">0.0% • $0</div>
      </div>
      <button class="btn-util" id="clearSlipBtn" style="display:none;" onclick="clearSlip()">Clear</button>
    </div>
  </div>
</div>

<script>
  const GITHUB_USER = "RockoDevXda";
  const NCAA_JSON_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/ncaa-sim/main/daily_slate.json`;
  const NBA_JSON_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/nba-props-sim/main/nba_props_slate.json`;

  let activeSport = "nba";
  let statFilter = "ALL";
  let ncaaGames = [];
  let nbaCards = [];
  let recommendedParlay = [];
  let slip = [];
  let deferredPrompt = null;

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById("installBtn").style.display = "inline-flex";
  });

  document.getElementById("installBtn").addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById("installBtn").style.display = "none";
  });

  function probToAmerican(pct) {
    const p = pct / 100;
    if (p <= 0 || p >= 1) return "N/A";
    return p >= 0.5 ? `${Math.round(-100 * p / (1 - p))}` : `+${Math.round(100 * (1 - p) / p)}`;
  }

  function switchSport(sport) {
    activeSport = sport;
    document.getElementById("tabNba").classList.toggle("active", sport === "nba");
    document.getElementById("tabNcaa").classList.toggle("active", sport === "ncaa");
    document.getElementById("statPills").style.display = sport === "nba" ? "flex" : "none";
    updateKPIs();
    render();
  }

  function setStatFilter(stat, btn) {
    statFilter = stat;
    document.querySelectorAll(".stat-chip").forEach(el => el.classList.remove("active"));
    btn.classList.add("active");
    render();
  }

  function toggleSlip(key, label, prob) {
    const idx = slip.findIndex(s => s.key === key);
    if (idx !== -1) {
      slip.splice(idx, 1);
    } else {
      slip.push({ key, label, prob });
    }
    updateSlipUI();
    render();
  }

  function clearSlip() {
    slip = [];
    updateSlipUI();
    render();
  }

  function loadRecommendedParlay() {
    if (!recommendedParlay.length) return;
    slip = recommendedParlay.map(item => ({ key: item.key, label: item.label, prob: item.prob }));
    updateSlipUI();
    render();
  }

  function updateSlipUI() {
    const chipsEl = document.getElementById("slipChips");
    const metricsEl = document.getElementById("slipMetrics");
    const clearBtn = document.getElementById("clearSlipBtn");
    const bankroll = Math.max(0, parseFloat(document.getElementById("bankrollInput").value) || 0);

    if (slip.length === 0) {
      chipsEl.innerHTML = `<span style="font-size:0.76rem; font-weight:800; color:var(--emerald); letter-spacing:0.05em;">⚡ CROSS-SPORT SLIP:</span>
        <span style="font-size:0.78rem; color:var(--muted);">Tap any Over/Under or Spread button to build a parlay</span>`;
      metricsEl.textContent = "0.0% • $0";
      clearBtn.style.display = "none";
      return;
    }

    clearBtn.style.display = "inline-flex";
    let combinedProb = 1.0;
    slip.forEach(s => { combinedProb *= (s.prob / 100); });
    const pct = +(combinedProb * 100).toFixed(1);

    // Assume standard -110 per leg decimal odds (1.909^n) for Quarter-Kelly sizing
    const decOdds = Math.pow(1.9091, slip.length);
    const b = decOdds - 1;
    const q = 1 - combinedProb;
    const fullKelly = Math.max(0, ((b * combinedProb) - q) / b);
    const quarterKellyWager = Math.round(bankroll * fullKelly * 0.25);

    metricsEl.textContent = `${pct}% (${probToAmerican(pct)}) • $${quarterKellyWager}`;
    chipsEl.innerHTML = slip.map(s => `
      <div class="chip">
        <span>${s.label} (${s.prob}%)</span>
        <button onclick="toggleSlip('${s.key}')">×</button>
      </div>
    `).join("");
  }

  function buildHeroParlay() {
    const picks = [];
    const usedGames = new Set();

    // Pick top 2 NBA prop edges from distinct games
    const topNba = [...nbaCards].sort((a, b) => b.bestProb - a.bestProb);
    for (const c of topNba) {
      if (picks.length >= 2) break;
      if (!usedGames.has(c.gameId)) {
        const isOver = c.overProb >= c.underProb;
        picks.push({
          key: isOver ? `${c.baseKey}-over` : `${c.baseKey}-under`,
          label: `${c.player} ${isOver ? 'O' : 'U'} ${c.line} ${c.stat}`,
          sub: `${c.team} vs ${c.opponent} • Model ${c.proj}`,
          prob: c.bestProb
        });
        usedGames.add(c.gameId);
      }
    }

    // Pick top 2 NCAA spread/ML edges
    const topNcaa = [...ncaaGames]
      .filter(g => g.has_line)
      .sort((a, b) => (b.spread_cover_pct || 0) - (a.spread_cover_pct || 0));

    for (const g of topNcaa) {
      if (picks.length >= 4) break;
      picks.push({
        key: `ncaa-${g.id}-ats`,
        label: g.spread_pick,
        sub: `${g.away_short} @ ${g.home_short} • +${g.edge_pts} pt edge`,
        prob: g.spread_cover_pct
      });
    }

    recommendedParlay = picks;
    const heroEl = document.getElementById("heroParlay");
    if (picks.length < 2) {
      heroEl.style.display = "none";
      return;
    }

    heroEl.style.display = "flex";
    let comb = 1.0;
    picks.forEach(p => { comb *= (p.prob / 100); });
    const combPct = +(comb * 100).toFixed(1);
    document.getElementById("heroOddsBadge").textContent = `Hit Rate: ${combPct}% (Fair ${probToAmerican(combPct)})`;

    document.getElementById("heroLegsGrid").innerHTML = picks.map((p, idx) => `
      <div class="hero-leg-card">
        <div class="hero-leg-pick">Leg ${idx + 1}: ${p.label}</div>
        <div class="hero-leg-meta">
          <span>${p.sub}</span>
          <strong style="color:var(--emerald);">${p.prob}%</strong>
        </div>
      </div>
    `).join("");
  }

  function updateKPIs() {
    document.getElementById("kpi2Val").textContent = ncaaGames.length;
    if (activeSport === "nba") {
      document.getElementById("kpi1Lbl").textContent = "NBA PROPS SIMULATED";
      document.getElementById("kpi1Val").textContent = nbaCards.length;
      const avg = nbaCards.length ? (nbaCards.reduce((a, c) => a + c.edgePts, 0) / nbaCards.length).toFixed(1) : "0.0";
      document.getElementById("kpi3Val").textContent = `+${avg} pt`;
      document.getElementById("kpi4Val").textContent = nbaCards.filter(c => c.bestProb >= 60).length;
    } else {
      document.getElementById("kpi1Lbl").textContent = "NCAA LINED GAMES";
      const lined = ncaaGames.filter(g => g.has_line);
      document.getElementById("kpi1Val").textContent = lined.length;
      const avg = lined.length ? (lined.reduce((a, g) => a + (g.edge_pts || 0), 0) / lined.length).toFixed(1) : "0.0";
      document.getElementById("kpi3Val").textContent = `+${avg} pt`;
      document.getElementById("kpi4Val").textContent = lined.filter(g => (g.spread_cover_pct || 0) >= 60).length;
    }
  }

  function render() {
    const grid = document.getElementById("cardsGrid");
    const q = document.getElementById("searchInput").value.toLowerCase().trim();
    const sortMode = document.getElementById("sortSelect").value;

    if (activeSport === "nba") {
      let list = nbaCards.filter(c => {
        const matchQ = !q || c.player.toLowerCase().includes(q) || c.team.toLowerCase().includes(q) || c.opponent.toLowerCase().includes(q);
        if (!matchQ) return false;
        if (statFilter === "USG" && c.usgBump <= 0) return false;
        if (statFilter !== "ALL" && statFilter !== "USG" && c.stat !== statFilter) return false;
        if (sortMode === "slip") return slip.some(s => s.key.startsWith(c.baseKey));
        return true;
      });

      list.sort((a, b) => sortMode === "prob" ? b.bestProb - a.bestProb : b.edgePts - a.edgePts);

      if (!list.length) {
        grid.innerHTML = `<div class="empty-state">No NBA player props match your filter.</div>`;
        return;
      }

      grid.innerHTML = list.map(c => {
        const overKey = `${c.baseKey}-over`;
        const underKey = `${c.baseKey}-under`;
        const overSel = slip.some(s => s.key === overKey);
        const underSel = slip.some(s => s.key === underKey);

        return `
          <article class="card ${(overSel || underSel) ? 'active-card' : ''}">
            <div class="card-top">
              <div>
                <div class="title-main">${c.player}</div>
                <div class="title-sub">
                  <span>${c.team} VS ${c.opponent}</span>
                  ${c.usgBump > 0 ? `<span class="usg-pill">⚡ +${c.usgBump}% USG</span>` : ''}
                </div>
              </div>
              <div class="pill-stack">
                <span class="mkt-badge">${c.stat}</span>
                <span class="edge-pill">+${c.edgePts.toFixed(1)} pt edge</span>
              </div>
            </div>

            <div class="telemetry-trio">
              <div class="t-col">
                <div class="t-lbl">LINE</div>
                <div class="t-val">${c.line}</div>
              </div>
              <div class="t-col">
                <div class="t-lbl">MODEL</div>
                <div class="t-val" style="color:var(--emerald);">${c.proj}</div>
              </div>
              <div class="t-col">
                <div class="t-lbl">HIT RATE</div>
                <div class="t-val" style="color:var(--sub);">${c.hit10}/10</div>
              </div>
            </div>

            <div class="prob-meter">
              <div class="meter-labels">
                <span style="color:var(--emerald);">OVER ${c.overProb.toFixed(1)}%</span>
                <span style="color:var(--cyan);">UNDER ${c.underProb.toFixed(1)}%</span>
              </div>
              <div class="meter-track">
                <div class="meter-fill-over" style="width:${c.overProb}%"></div>
                <div class="meter-fill-under" style="width:${c.underProb}%"></div>
              </div>
            </div>

            <div class="btn-pair">
              <button class="pick-btn ${overSel ? 'sel-over' : ''}" onclick="toggleSlip('${overKey}','${c.player} O ${c.line} ${c.stat}',${c.overProb})">
                <span>+ Over ${c.line}</span>
                <span>${c.overProb.toFixed(1)}%</span>
              </button>
              <button class="pick-btn ${underSel ? 'sel-under' : ''}" onclick="toggleSlip('${underKey}','${c.player} U ${c.line} ${c.stat}',${c.underProb})">
                <span>+ Under ${c.line}</span>
                <span>${c.underProb.toFixed(1)}%</span>
              </button>
            </div>
          </article>
        `;
      }).join("");
    } else {
      let list = ncaaGames.filter(g => {
        const matchQ = !q || g.away_team.toLowerCase().includes(q) || g.home_team.toLowerCase().includes(q);
        if (!matchQ) return false;
        if (sortMode === "slip") return slip.some(s => s.key.startsWith(`ncaa-${g.id}`));
        return true;
      });

      list.sort((a, b) => sortMode === "prob"
        ? (b.spread_cover_pct || b.favored_prob || 0) - (a.spread_cover_pct || a.favored_prob || 0)
        : (b.edge_pts || 0) - (a.edge_pts || 0));

      if (!list.length) {
        grid.innerHTML = `<div class="empty-state">No NCAA matchups match your filter.</div>`;
        return;
      }

      grid.innerHTML = list.map(g => {
        const atsKey = `ncaa-${g.id}-ats`;
        const mlKey = `ncaa-${g.id}-ml`;
        const atsSel = slip.some(s => s.key === atsKey);
        const mlSel = slip.some(s => s.key === mlKey);
        const simMargin = Math.abs((g.home_proj || 0) - (g.away_proj || 0)).toFixed(1);
        const simFav = (g.home_proj || 0) >= (g.away_proj || 0) ? g.home_short : g.away_short;

        return `
          <article class="card ${(atsSel || mlSel) ? 'active-card' : ''}">
            <div class="card-top">
              <div>
                <div class="title-main">${g.away_short} @ ${g.home_short}</div>
                <div class="title-sub">SIM: ${g.away_proj} - ${g.home_proj} • ${g.neutral ? 'NEUTRAL' : (g.venue || 'D1')}</div>
              </div>
              <div class="pill-stack">
                <span class="mkt-badge">SPREAD</span>
                <span class="edge-pill">+${(g.edge_pts || 0).toFixed(1)} pt edge</span>
              </div>
            </div>

            <div class="telemetry-trio">
              <div class="t-col">
                <div class="t-lbl">BOOK LINE</div>
                <div class="t-val" style="font-size:1.02rem;">${g.market_line || 'PK'}</div>
              </div>
              <div class="t-col">
                <div class="t-lbl">MODEL</div>
                <div class="t-val" style="font-size:1.02rem; color:var(--emerald);">${simFav} -${simMargin}</div>
              </div>
              <div class="t-col">
                <div class="t-lbl">COVER %</div>
                <div class="t-val" style="font-size:1.02rem; color:var(--cyan);">${(g.spread_cover_pct || g.favored_prob).toFixed(1)}%</div>
              </div>
            </div>

            <div class="prob-meter">
              <div class="meter-labels">
                <span style="color:var(--emerald);">${g.away_short} ${g.away_win_pct}%</span>
                <span style="color:var(--cyan);">${g.home_short} ${g.home_win_pct}%</span>
              </div>
              <div class="meter-track">
                <div class="meter-fill-over" style="width:${g.away_win_pct}%"></div>
                <div class="meter-fill-under" style="width:${g.home_win_pct}%"></div>
              </div>
            </div>

            <div class="btn-pair">
              ${g.has_line
                ? `<button class="pick-btn ${atsSel ? 'sel-over' : ''}" onclick="toggleSlip('${atsKey}','${g.spread_pick}',${g.spread_cover_pct})">
                    <span>+ ${g.spread_pick}</span>
                    <span>${g.spread_cover_pct.toFixed(1)}%</span>
                   </button>`
                : `<button class="pick-btn" disabled><span>Line Pending</span><span>—</span></button>`
              }
              <button class="pick-btn ${mlSel ? 'sel-under' : ''}" onclick="toggleSlip('${mlKey}','${g.favored_team} ML',${g.favored_prob})">
                <span>+ ${g.favored_team} ML</span>
                <span>${g.favored_prob.toFixed(1)}%</span>
              </button>
            </div>
          </article>
        `;
      }).join("");
    }
  }

  function buildNbaPropCards(players) {
    const cards = [];
    players.forEach(p => {
      (p.all_props || []).forEach(m => {
        const overProb = Number(m.prob || 50);
        const underProb = +(100 - overProb).toFixed(1);
        const edgePts = Math.abs((Number(m.proj) || 0) - (Number(m.line) || 0));
        cards.push({
          baseKey: `nba-${p.id}-${m.stat}`,
          gameId: p.game_id || `${p.team}-${p.opponent}`,
          player: p.player,
          team: p.team,
          opponent: p.opponent,
          usgBump: p.usage_bump_pct || 0,
          stat: m.stat,
          line: m.line,
          proj: m.proj,
          overProb,
          underProb,
          bestProb: Math.max(overProb, underProb),
          edgePts,
          hit10: Math.max(1, Math.min(9, Math.round(overProb / 10))),
        });
      });
    });
    return cards;
  }

  async function loadAllData(force = false) {
    const bust = force ? `?t=${Date.now()}` : `?t=${Math.floor(Date.now() / 60000)}`;
    document.getElementById("lastSyncText").textContent = "Syncing feeds...";

    try {
      const [ncaaRes, nbaRes] = await Promise.allSettled([
        fetch(NCAA_JSON_URL + bust),
        fetch(NBA_JSON_URL + bust)
      ]);

      if (ncaaRes.status === "fulfilled" && ncaaRes.value.ok) {
        ncaaGames = await ncaaRes.value.json();
      }
      if (nbaRes.status === "fulfilled" && nbaRes.value.ok) {
        const rawPlayers = await nbaRes.value.json();
        nbaCards = buildNbaPropCards(rawPlayers);
      }

      document.getElementById("ncaaCount").textContent = ncaaGames.length;
      document.getElementById("nbaCount").textContent = nbaCards.length;

      const ts = ncaaGames[0]?.generated_at || "Live";
      document.getElementById("lastSyncText").textContent = `Last sim ${ts}`;

      buildHeroParlay();
      updateKPIs();
      render();
    } catch (err) {
      document.getElementById("lastSyncText").textContent = "Offline mode";
    }
  }

  loadAllData();
</script>
</body>
</html>
