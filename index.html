<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#07090d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SimLab" />
  <link rel="icon" type="image/jpeg" href="./icon-512.png.jpeg" />
  <link rel="apple-touch-icon" href="./icon-512.png.jpeg" />
  <link rel="manifest" href="./manifest.json" />
  <title>SimLab | Pro Sports Terminal</title>
  <style>
    :root {
      --bg: #07090d;
      --card: #0e131a;
      --card-hi: #141b24;
      --border: #1c2532;
      --text: #f8fafc;
      --sub: #94a3b8;
      --muted: #64748b;
      --emerald: #10b981;
      --emerald-dim: rgba(16, 185, 129, 0.16);
      --orange: #f97316;
      --orange-dim: rgba(249, 115, 22, 0.16);
      --cyan: #38bdf8;
      --cyan-dim: rgba(56, 189, 248, 0.14);
      --danger: #ef4444;
      --danger-dim: rgba(239, 68, 68, 0.16);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.35;
      padding-bottom: 32px;
      -webkit-font-smoothing: antialiased;
    }

    body.has-slip { padding-bottom: 145px; }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 12px;
    }

    header {
      padding: 12px 0 10px;
      border-bottom: 1px solid var(--border);
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand img {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      object-fit: cover;
    }

    .brand-title {
      font-size: 0.98rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .sync-sub {
      font-size: 0.68rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--emerald);
    }

    .btn-sm {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--sub);
      padding: 6px 10px;
      border-radius: 7px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px;
      background: #0b0e14;
      padding: 3px;
      border-radius: 9px;
      border: 1px solid var(--border);
    }

    .tab {
      border: none;
      background: transparent;
      color: var(--sub);
      padding: 7px 6px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
    }

    .tab.active-nba { background: var(--orange); color: #fff; }
    .tab.active-ncaa { background: var(--emerald); color: #03150a; }
    .tab.active-bets { background: var(--cyan); color: #03131f; }

    .toolbar {
      display: flex;
      gap: 6px;
      margin: 10px 0 8px;
    }

    .search-in {
      flex: 1;
      min-width: 0;
      background: var(--card);
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      outline: none;
    }

    .filter-sel {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 8px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      max-width: 142px;
    }

    .chip-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .chip-strip::-webkit-scrollbar { display: none; }

    .f-chip {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--sub);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .f-chip.active {
      background: var(--emerald-dim);
      border-color: var(--emerald);
      color: var(--emerald);
    }

    .parlay-banner {
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.12), rgba(14, 19, 26, 0.95));
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 10px;
      padding: 9px 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .parlay-banner-text {
      font-size: 0.76rem;
      font-weight: 700;
      color: #fff;
    }

    .parlay-banner-sub {
      font-size: 0.68rem;
      color: var(--emerald);
      font-weight: 600;
    }

    .btn-quick-parlay {
      background: var(--emerald);
      color: #03150a;
      border: none;
      padding: 6px 10px;
      border-radius: 7px;
      font-size: 0.72rem;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }

    .list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(335px, 1fr));
      gap: 9px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card.in-slip { border-color: var(--emerald); }

    .c-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 6px;
    }

    .c-name {
      font-size: 0.92rem;
      font-weight: 700;
      color: #fff;
    }

    .c-meta {
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 600;
    }

    .sharp-tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 3px;
    }

    .s-tag {
      background: var(--orange-dim);
      color: var(--orange);
      border: 1px solid rgba(249, 115, 22, 0.3);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.63rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .s-tag.cyan {
      background: var(--cyan-dim);
      color: var(--cyan);
      border-color: rgba(56, 189, 248, 0.3);
    }

    .edge-tag {
      background: var(--emerald-dim);
      color: var(--emerald);
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 0.66rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .streak-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #090c11;
      border: 1px solid var(--border);
      padding: 5px 8px;
      border-radius: 7px;
      font-size: 0.68rem;
      color: var(--sub);
    }

    .dots-wrap {
      display: flex;
      gap: 3px;
      align-items: center;
    }

    .g-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #232d3d;
    }

    .g-dot.hit {
      background: var(--emerald);
      box-shadow: 0 0 5px rgba(16, 185, 129, 0.5);
    }

    .prop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .ncaa-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px;
    }

    .p-btn {
      background: #131922;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 8px;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      gap: 4px;
    }

    .p-btn .sim-hint {
      display: block;
      font-size: 0.62rem;
      color: var(--muted);
      font-weight: 500;
    }

    .p-btn .prob-val {
      font-weight: 800;
      color: var(--sub);
      text-align: right;
    }

    .p-btn .hit-mini {
      display: block;
      font-size: 0.6rem;
      color: var(--muted);
      font-weight: 600;
    }

    .p-btn.hot .prob-val { color: var(--emerald); }

    .p-btn.selected {
      background: var(--emerald-dim);
      border-color: var(--emerald);
    }

    .p-btn.selected .prob-val { color: var(--emerald); }

    .ncaa-scores {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0a0e14;
      padding: 6px 9px;
      border-radius: 7px;
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      gap: 6px;
    }

    .load-more-btn {
      width: 100%;
      margin-top: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px;
      border-radius: 9px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* My Bets Summary & Live Sweat Cards */
    .bets-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin: 10px 0;
    }

    .b-stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 8px 10px;
      text-align: center;
    }

    .b-stat-lbl {
      font-size: 0.64rem;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .b-stat-val {
      font-size: 0.96rem;
      font-weight: 800;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .bet-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bet-card.won { border-color: var(--emerald); }
    .bet-card.lost { border-color: var(--danger); opacity: 0.86; }
    .bet-card.live { border-color: var(--cyan); }

    .status-pill {
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .status-pill.won { background: var(--emerald-dim); color: var(--emerald); }
    .status-pill.lost { background: var(--danger-dim); color: var(--danger); }
    .status-pill.live { background: var(--cyan-dim); color: var(--cyan); }
    .status-pill.pending { background: #18212e; color: var(--sub); }

    .leg-row {
      background: #0a0e14;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 9px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .leg-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
      font-weight: 700;
      gap: 6px;
    }

    .leg-sub {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.68rem;
      color: var(--sub);
      font-variant-numeric: tabular-nums;
    }

    .prog-track {
      width: 100%;
      height: 5px;
      background: #1a2230;
      border-radius: 999px;
      overflow: hidden;
    }

    .prog-fill {
      height: 100%;
      background: var(--cyan);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .prog-fill.hit { background: var(--emerald); }
    .prog-fill.miss { background: var(--danger); }

    /* Floating Slip Drawer */
    .slip-bar {
      position: fixed;
      bottom: 10px;
      left: 10px;
      right: 10px;
      max-width: 1096px;
      margin: 0 auto;
      background: rgba(13, 18, 26, 0.98);
      border: 1px solid var(--emerald);
      border-radius: 12px;
      padding: 10px 12px;
      z-index: 50;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(12px);
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    body.has-slip .slip-bar { display: flex; }

    .slip-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .stake-box {
      display: inline-flex;
      align-items: center;
      background: #0a0e14;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--emerald);
    }

    .stake-box input {
      width: 44px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.74rem;
      font-weight: 800;
      outline: none;
      text-align: right;
    }

    .slip-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .slip-chips::-webkit-scrollbar { display: none; }

    .s-chip {
      background: #18212e;
      border: 1px solid var(--border);
      color: #fff;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .s-chip span { color: var(--danger); font-weight: 900; cursor: pointer; }
  </style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="top-row">
      <div class="brand">
        <img src="./icon-512.png.jpeg" alt="SimLab" onerror="this.style.display='none'" />
        <div>
          <div class="brand-title">SimLab Command Center</div>
          <div class="sync-sub"><span class="dot"></span><span id="syncText">Syncing live slates...</span></div>
        </div>
      </div>
      <div style="display:flex; gap:6px;">
        <button id="installBtn" class="btn-sm" style="display:none; border-color:var(--emerald); color:var(--emerald);">📲 Install</button>
        <button class="btn-sm" onclick="handleManualRefresh()">↻ Sync</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active-nba" id="tabNba" onclick="switchSport('nba')">🔥 NBA (<span id="nbaCount">0</span>)</button>
      <button class="tab" id="tabNcaa" onclick="switchSport('ncaa')">🏀 NCAA (<span id="ncaaCount">0</span>)</button>
      <button class="tab" id="tabBets" onclick="switchSport('bets')">🎟️ My Bets (<span id="betsCount">0</span>)</button>
    </div>
  </header>

  <div id="marketControls">
    <div class="toolbar">
      <input type="text" id="searchInput" class="search-in" placeholder="Search player or team..." oninput="resetAndRender()" />
      <select id="filterSelect" class="filter-sel" onchange="resetAndRender()">
        <option value="all">All Matchups</option>
        <option value="edge">Top Edges Only</option>
        <option value="slip">In My Slip</option>
      </select>
    </div>

    <div class="chip-strip" id="nbaChips">
      <button class="f-chip active" onclick="setSubFilter('ALL', this)">ALL PLAYERS</button>
      <button class="f-chip" onclick="setSubFilter('HOT', this)">🔥 8/10 STREAKS</button>
      <button class="f-chip" onclick="setSubFilter('USG', this)">⚡ USAGE BUMPS</button>
      <button class="f-chip" onclick="setSubFilter('PTS', this)">POINTS</button>
      <button class="f-chip" onclick="setSubFilter('REB', this)">REBOUNDS</button>
      <button class="f-chip" onclick="setSubFilter('AST', this)">ASSISTS</button>
      <button class="f-chip" onclick="setSubFilter('PRA', this)">PRA</button>
    </div>

    <div class="chip-strip" id="ncaaChips" style="display:none;">
      <button class="f-chip active" onclick="setNcaaFilter('ALL', this)">ALL GAMES</button>
      <button class="f-chip" onclick="setNcaaFilter('MOVES', this)">📉 LINE MOVES</button>
      <button class="f-chip" onclick="setNcaaFilter('TOTALS', this)">🎯 BEST TOTALS</button>
      <button class="f-chip" onclick="setNcaaFilter('SPREADS', this)">📊 BEST SPREADS</button>
    </div>

    <div class="parlay-banner" id="heroParlay" style="display:none;">
      <div>
        <div class="parlay-banner-text">🎯 AI Top 4-Leg Edge Parlay</div>
        <div class="parlay-banner-sub" id="heroParlaySub">Calculating optimal edges...</div>
      </div>
      <button class="btn-quick-parlay" onclick="loadTopParlay()">+ Load 4 Legs</button>
    </div>
  </div>

  <div id="betsControls" style="display:none;">
    <div class="bets-summary">
      <div class="b-stat">
        <div class="b-stat-lbl">Active Risk</div>
        <div class="b-stat-val" id="statActiveRisk" style="color:var(--cyan);">$0</div>
      </div>
      <div class="b-stat">
        <div class="b-stat-lbl">Net P/L</div>
        <div class="b-stat-val" id="statNetPL">$0</div>
      </div>
      <div class="b-stat">
        <div class="b-stat-lbl">Record</div>
        <div class="b-stat-val" id="statRecord">0-0</div>
      </div>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <span style="font-size:0.7rem; color:var(--muted);" id="livePollStatus">Live ESPN auto-tracker active (45s)</span>
      <button class="btn-sm" style="padding:4px 9px; font-size:0.7rem; border-color:var(--cyan); color:var(--cyan);" onclick="refreshTrackedBets(true)">⚡ Update Live Scores</button>
    </div>
  </div>

  <main class="list" id="cardsList"></main>
  <button class="load-more-btn" id="loadMoreBtn" style="display:none;" onclick="showMore()">Show More Results</button>
</div>

<div class="slip-bar" id="slipBar">
  <div class="slip-top">
    <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
      <span style="font-size:0.75rem; font-weight:800; color:var(--emerald);">🎯 SLIP (<span id="slipCount">0</span>)</span>
      <span class="stake-box">$<input type="number" id="stakeInput" value="25" min="1" oninput="updateSlipUI()" /></span>
      <span style="font-size:0.74rem; font-weight:800; color:var(--cyan);" id="slipPayout">→ $48</span>
    </div>
    <div style="display:flex; gap:5px;">
      <button class="btn-quick-parlay" style="padding:4px 9px; font-size:0.7rem;" onclick="saveTrackedBet()">📌 Track Bet</button>
      <button id="copySlipBtn" class="btn-sm" style="padding:3px 7px; font-size:0.7rem;" onclick="copySlipText()">📋</button>
      <button class="btn-sm" style="padding:3px 7px; font-size:0.7rem;" onclick="clearSlip()">×</button>
    </div>
  </div>
  <div class="slip-chips" id="slipChips"></div>
</div>

<script>
  const GITHUB_USER = "RockoDevXda";

  const NBA_JSON_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/nba-props-sim/main/nba_props_slate.json`; const STORAGE_KEY = "simlab_tracked_bets_v1";  let activeSport = "nba"; let subFilter = "ALL"; let ncaaFilter = "ALL"; let visibleLimit = 25; let ncaaGames = []; let nbaPlayers = []; let topParlayLegs = []; let slip = []; let trackedBets = loadStoredBets(); let livePollTimer = null; let deferredPrompt = null;  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("./sw.js").catch(() => {}); }  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById("installBtn").style.display = "inline-block"; });  document.getElementById("installBtn").addEventListener("click", async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; document.getElementById("installBtn").style.display = "none"; });  function loadStoredBets() { try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : []; } catch (e) { return []; } }  function persistBets() { localStorage.setItem(STORAGE_KEY, JSON.stringify(trackedBets)); document.getElementById("betsCount").textContent = trackedBets.length; }  function probToAmerican(pct) { const p = pct / 100; if (p <= 0 \vert{}\vert{} p >= 1) return "N/A"; return p >= 0.5 ? `${Math.round(-100 * p / (1 - p))}` : `+${Math.round(100 * (1 - p) / p)}`; }  function switchSport(sport) { activeSport = sport; visibleLimit = 25; document.getElementById("tabNba").className = sport === "nba" ? "tab active-nba" : "tab"; document.getElementById("tabNcaa").className = sport === "ncaa" ? "tab active-ncaa" : "tab"; document.getElementById("tabBets").className = sport === "bets" ? "tab active-bets" : "tab";  document.getElementById("marketControls").style.display = sport === "bets" ? "none" : "block"; document.getElementById("betsControls").style.display = sport === "bets" ? "block" : "none"; documen   function extractNbaPlayerStat(summaryJson, playerId, playerName, statCode) {

      if (!statGroup) continue;
      const names = (statGroup.names || []).map(n => n.toUpperCase());
      const idxPts = names.indexOf("PTS");
      const idxReb = names.indexOf("REB");
      const idxAst = names.indexOf("AST");
      const idx3pt = names.findIndex(n => n === "3PT" || n === "3PM");

      for (const athEntry of (statGroup.athletes || [])) {
        const idMatch = playerId && String(athEntry.athlete?.id) === playerId;
        const nameMatch = playerName && athEntry.athlete?.displayName?.toLowerCase() === playerName.toLowerCase();
        if (idMatch || nameMatch) {
          const s = athEntry.stats || [];
          const pts = parseFloat(s[idxPts]) || 0;
          const reb = parseFloat(s[idxReb]) || 0;
          const ast = parseFloat(s[idxAst]) || 0;
          let tpm = 0;
          if (idx3pt >= 0 && s[idx3pt]) {
            tpm = parseFloat(String(s[idx3pt]).split("-")[0]) || 0;
          }
          if (statCode === "PTS") return pts;
          if (statCode === "REB") return reb;
          if (statCode === "AST") return ast;
          if (statCode === "3PM") return tpm;

  }
