<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PickPulse</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#070a0f" />
  <link rel="apple-touch-icon" href="./icon-512.jpeg" />
  <style>
    :root {
      --bg: #070a0f;
      --panel: #0e141e;
      --card: #121a26;
      --border: #1e293b;
      --text: #f1f5f9;
      --sub: #94a3b8;
      --muted: #64748b;
      --emerald: #10b981;
      --cyan: #38bdf8;
      --gold: #f59e0b;
      --orange: #fb923c;
      --purple: #a855f7;
      --pink: #ec4899;
      --danger: #ef4444;
      --rail-w: 224px;
      --bottom-nav-h: 62px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0 0 calc(var(--bottom-nav-h) + 28px) 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body.has-slip { padding-bottom: calc(var(--bottom-nav-h) + 195px); }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(7, 10, 15, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .brand-wrap { display: flex; align-items: center; gap: 10px; }
    .brand-icon { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); }
    .brand-title { font-size: 1rem; font-weight: 800; letter-spacing: -0.01em; }
    .sync-row { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--sub); }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--emerald); display: inline-block; }

    .header-actions { display: flex; align-items: center; gap: 6px; }
    .btn-sm {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-sm:hover { border-color: var(--cyan); }

    /* App Shell: Sidebar Rail + Main Content */
    .app-shell {
      display: flex;
      min-height: calc(100vh - 56px);
    }

    .side-rail {
      display: none;
    }

    .main-stage {
      flex: 1;
      min-width: 0;
    }

    .wrap { max-width: 1180px; margin: 0 auto; padding: 12px 14px; }

    /* Mobile Fixed Bottom Nav Bar */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--bottom-nav-h);
      z-index: 35;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: rgba(10, 14, 22, 0.98);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 4px 6px;
    }
    .b-nav-btn {
      background: transparent;
      border: none;
      color: var(--sub);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 0.68rem;
      font-weight: 800;
      border-radius: 8px;
      cursor: pointer;
    }
    .b-nav-btn .nav-ico { font-size: 1.05rem; line-height: 1; }
    .b-nav-btn.active-ev { color: var(--gold); background: rgba(245, 158, 11, 0.12); }
    .b-nav-btn.active-nba { color: var(--purple); background: rgba(168, 85, 247, 0.14); }
    .b-nav-btn.active-ncaa { color: var(--orange); background: rgba(251, 146, 60, 0.14); }
    .b-nav-btn.active-bets { color: var(--pink); background: rgba(236, 72, 153, 0.14); }

    @media (min-width: 860px) {
      body { padding-bottom: 40px; }
      body.has-slip { padding-bottom: 185px; }
      .bottom-nav { display: none; }
      .side-rail {
        display: flex;
        flex-direction: column;
        width: var(--rail-w);
        flex-shrink: 0;
        background: var(--panel);
        border-right: 1px solid var(--border);
        padding: 14px 10px;
        gap: 6px;
        position: sticky;
        top: 56px;
        height: calc(100vh - 56px);
      }
      .rail-section-lbl {
        font-size: 0.65rem;
        font-weight: 800;
        color: var(--muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 8px 10px 2px;
      }
      .rail-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        background: transparent;
        color: var(--sub);
        border: 1px solid transparent;
        border-radius: 9px;
        padding: 10px 11px;
        font-size: 0.8rem;
        font-weight: 800;
        cursor: pointer;
        text-align: left;
      }
      .rail-btn:hover { background: rgba(255, 255, 255, 0.04); color: #fff; }
      .rail-btn .rail-badge {
        background: var(--card);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 1px 7px;
        font-size: 0.68rem;
        font-weight: 800;
      }
      .rail-btn.active-ev { background: rgba(245, 158, 11, 0.15); color: var(--gold); border-color: rgba(245, 158, 11, 0.35); }
      .rail-btn.active-nba { background: rgba(168, 85, 247, 0.16); color: #d8b4fe; border-color: rgba(168, 85, 247, 0.35); }
      .rail-btn.active-ncaa { background: rgba(251, 146, 60, 0.16); color: #fdba74; border-color: rgba(251, 146, 60, 0.35); }
      .rail-btn.active-bets { background: rgba(236, 72, 153, 0.16); color: #f9a8d4; border-color: rgba(236, 72, 153, 0.35); }
      .rail-sub-group {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding-left: 14px;
        margin-bottom: 4px;
      }
      .rail-sub-btn {
        background: transparent;
        border: none;
        color: var(--sub);
        font-size: 0.74rem;
        font-weight: 700;
        padding: 6px 10px;
        border-radius: 7px;
        text-align: left;
        cursor: pointer;
      }
      .rail-sub-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.03); }
      .rail-sub-btn.active { color: var(--cyan); background: rgba(56, 189, 248, 0.12); font-weight: 800; }
      .slip-bar { left: var(--rail-w); bottom: 0 !important; }
    }

    /* Hub Sub-Nav Bar (Top of Workspace) */
    .hub-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .hub-title {
      font-size: 1.02rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .sub-tabs {
      display: flex;
      gap: 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .sub-tabs::-webkit-scrollbar { display: none; }
    .sub-tab {
      flex: 1 0 auto;
      background: transparent;
      color: var(--sub);
      border: none;
      border-radius: 7px;
      padding: 7px 12px;
      font-size: 0.76rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .sub-tab.active {
      background: var(--cyan);
      color: #03131f;
    }
    .sub-tab.active-ncaa {
      background: var(--orange);
      color: #090b0e;
    }
    .sub-tab.active-nba {
      background: var(--purple);
      color: #fff;
    }

    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .search-input, .filter-select {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.82rem;
    }
    .search-input { flex: 1; }
    .filter-select { min-width: 140px; font-weight: 700; }

    .chips-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 8px;
      scrollbar-width: none;
    }
    .chips-row::-webkit-scrollbar { display: none; }
    .f-chip {
      background: var(--panel);
      color: var(--sub);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.7rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .f-chip.active { background: var(--emerald); color: #03150a; border-color: var(--emerald); }

    .parlay-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.14), rgba(56, 189, 248, 0.14));
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .parlay-banner-text { font-size: 0.82rem; font-weight: 800; color: #fff; }
    .parlay-banner-sub { font-size: 0.72rem; color: var(--sub); margin-top: 2px; }
    .btn-quick-parlay {
      background: var(--emerald);
      color: #03150a;
      border: none;
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 0.74rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .bets-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }
    .b-stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 8px 10px;
      text-align: center;
    }
    .b-stat-lbl { font-size: 0.66rem; color: var(--sub); text-transform: uppercase; font-weight: 700; }
    .b-stat-val { font-size: 1rem; font-weight: 800; margin-top: 2px; }

    .list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 10px;
    }
    .card, .bet-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 11px 12px;
    }
    .card.in-slip { border-color: var(--cyan); }
    .recap-card.hit {
      border-left: 4px solid #10b981;
      background: rgba(16, 185, 129, 0.08);
    }
    .recap-card.miss {
      border-left: 4px solid #ef4444;
      background: rgba(239, 68, 68, 0.08);
    }

    .c-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .c-name { font-size: 0.9rem; font-weight: 800; color: #fff; }
    .c-meta { font-size: 0.72rem; color: var(--sub); margin-top: 2px; }
    .edge-tag {
      background: rgba(16, 185, 129, 0.16);
      color: var(--emerald);
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 0.7rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .sharp-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
    .s-tag {
      background: rgba(16, 185, 129, 0.14);
      color: var(--emerald);
      border-radius: 5px;
      padding: 2px 6px;
      font-size: 0.66rem;
      font-weight: 700;
    }
    .s-tag.cyan { background: rgba(56, 189, 248, 0.15); color: var(--cyan); }
    .s-tag.gold { background: rgba(245, 158, 11, 0.16); color: var(--gold); }

    .h2h-bar {
      margin-top: 7px;
      padding: 5px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      font-size: 0.7rem;
      color: var(--sub);
    }
    .ncaa-scores {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 0.76rem;
      color: var(--sub);
    }
    .ncaa-grid, .prop-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .prop-grid { grid-template-columns: repeat(2, 1fr); }

    .p-btn {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 8px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: left;
    }
    .p-btn.hot .prob-val { color: var(--emerald); }
    .p-btn.selected { background: var(--cyan); color: #03131f; border-color: var(--cyan); }
    .p-btn.selected .prob-val, .p-btn.selected .sim-hint, .p-btn.selected .hit-mini { color: #03131f; }
    .prob-val { font-weight: 800; display: flex; flex-direction: column; align-items: flex-end; }
    .sim-hint { display: block; font-size: 0.63rem; color: var(--muted); font-weight: 600; margin-top: 2px; }
    .hit-mini { font-size: 0.62rem; color: var(--sub); font-weight: 700; }

    .streak-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 7px;
      font-size: 0.7rem;
      color: var(--sub);
    }
    .dots-wrap { display: flex; gap: 3px; }
    .g-dot { width: 7px; height: 7px; border-radius: 50%; background: #334155; }
    .g-dot.hit { background: var(--emerald); }

    .ev-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      text-align: center;
    }
    .ev-m-lbl { font-size: 0.64rem; color: var(--sub); font-weight: 700; text-transform: uppercase; }
    .ev-m-val { font-size: 0.82rem; font-weight: 800; margin-top: 2px; }

    .status-pill { border-radius: 6px; padding: 2px 7px; font-size: 0.68rem; font-weight: 800; }
    .status-pill.won { background: rgba(16, 185, 129, 0.2); color: var(--emerald); }
    .status-pill.lost { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .status-pill.live { background: rgba(56, 189, 248, 0.2); color: var(--cyan); }
    .status-pill.pending { background: rgba(245, 158, 11, 0.2); color: var(--gold); }

    .leg-row { margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--border); font-size: 0.74rem; }
    .leg-top { display: flex; justify-content: space-between; font-weight: 700; }
    .leg-sub { display: flex; justify-content: space-between; font-size: 0.68rem; color: var(--sub); margin-top: 2px; }
    .prog-track { height: 5px; background: #1e293b; border-radius: 999px; overflow: hidden; margin-top: 5px; }
    .prog-fill { height: 100%; background: var(--cyan); }
    .prog-fill.hit { background: var(--emerald); }
    .prog-fill.miss { background: var(--danger); }

    .hedge-drawer { margin-top: 8px; padding: 8px; border-radius: 8px; background: var(--panel); border: 1px solid var(--border); }
    .hedge-head { display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; font-weight: 800; margin-bottom: 6px; }
    .hedge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }

    .load-more-btn {
      display: block;
      margin: 14px auto 0;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
    }

    .slip-bar {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: var(--bottom-nav-h);
      z-index: 32;
      background: rgba(10, 14, 22, 0.98);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--cyan);
      padding: 8px 12px;
    }
    body.has-slip .slip-bar { display: block; }
    .slip-top, .kelly-row, .book-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .kelly-row, .book-row { margin-top: 6px; font-size: 0.72rem; }
    .stake-box {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #070a0f;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .stake-box input {
      width: 54px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      text-align: right;
    }
    .kelly-pill {
      background: rgba(16, 185, 129, 0.16);
      color: var(--emerald);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 7px;
      padding: 3px 8px;
      font-size: 0.7rem;
      font-weight: 800;
      cursor: pointer;
    }
    .kelly-pill.no-edge {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.4);
    }
    .book-sel {
      background: #070a0f;
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .btn-book {
      background: var(--cyan);
      color: #03131f;
      border: none;
      border-radius: 7px;
      padding: 4px 9px;
      font-size: 0.7rem;
      font-weight: 800;
      cursor: pointer;
    }
    .slip-chips { display: flex; gap: 5px; overflow-x: auto; margin-top: 6px; padding-bottom: 2px; }
    .s-chip {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 0.68rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .s-chip span { cursor: pointer; color: var(--danger); margin-left: 4px; font-weight: 900; }
  </style>
</head>
<body>
  <header>
    <div class="brand-wrap">
      <img src="./icon-512.jpeg" alt="SimLab" class="brand-icon" />
      <div>
        <div class="brand-title">PickPulse</div>
        <div class="sync-row">
          <span class="sync-dot"></span>
          <span id="syncText">Syncing live slates...</span>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <button id="syncPhoneBtn" class="btn-sm" style="border-color:var(--cyan); color:var(--cyan);" onclick="exportSlipToPhoneUrl()">📱 Send to Phone</button>
      <button id="installBtn" class="btn-sm" style="display:none; border-color:var(--emerald); color:var(--emerald);">📲 Install</button>
      <button class="btn-sm" onclick="handleManualRefresh()">↻ Sync</button>
    </div>
  </header>

  <div class="app-shell">
    <!-- Desktop Left Sidebar Rail -->
    <aside class="side-rail" aria-label="Primary Navigation">
      <div class="rail-section-lbl">Workspaces</div>
      <button id="railEv" class="rail-btn active-ev" onclick="switchHub('ev')">
        <span>💎 +EV Edge Board</span>
        <span class="rail-badge" id="evCount">0</span>
      </button>

      <button id="railNba" class="rail-btn" onclick="switchHub('nba', 'props')">
        <span>🏀 NBA Hub</span>
        <span class="rail-badge" id="nbaTotalCount">0</span>
      </button>
      <div class="rail-sub-group">
        <button id="railNbaProps" class="rail-sub-btn" onclick="switchHub('nba', 'props')">🔥 Player Props (<span id="nbaCount">0</span>)</button>
        <button id="railNbaGames" class="rail-sub-btn" onclick="switchHub('nba', 'games')">📊 Game Lines (<span id="nbaGamesCount">0</span>)</button>
        <button id="railNbaRecap" class="rail-sub-btn" onclick="switchHub('nba', 'recap')">📋 NBA Recap</button>
      </div>

      <button id="railNcaa" class="rail-btn" onclick="switchHub('ncaa', 'games')">
        <span>🎓 NCAA Hub</span>
        <span class="rail-badge" id="ncaaCount">0</span>
      </button>
      <div class="rail-sub-group">
        <button id="railNcaaGames" class="rail-sub-btn" onclick="switchHub('ncaa', 'games')">🏀 NCAA Predictions</button>
        <button id="railNcaaRecap" class="rail-sub-btn" onclick="switchHub('ncaa', 'recap')">📋 NCAA Recap</button>
      </div>

      <div class="rail-section-lbl">Tracking</div>
      <button id="railBets" class="rail-btn" onclick="switchHub('bets')">
        <span>🎟️ My Tracked Bets</span>
        <span class="rail-badge" id="betsCount">0</span>
      </button>
    </aside>

    <!-- Main Workspace Stage -->
    <div class="main-stage">
      <div class="wrap">
        <div class="hub-header">
          <div class="hub-title" id="hubTitle">💎 +EV Edge Board</div>
        </div>

        <!-- Hub-Specific Sub-Tabs (Shown inside NBA Hub & NCAA Hub) -->
        <div id="nbaSubTabs" class="sub-tabs" style="display:none;">
          <button id="subNbaProps" class="sub-tab active-nba" onclick="switchHub('nba', 'props')">🔥 Player Props</button>
          <button id="subNbaGames" class="sub-tab" onclick="switchHub('nba', 'games')">🏀 Game Lines</button>
          <button id="subNbaRecap" class="sub-tab" onclick="switchHub('nba', 'recap')">📊 NBA Recap</button>
        </div>

        <div id="ncaaSubTabs" class="sub-tabs" style="display:none;">
          <button id="subNcaaGames" class="sub-tab active-ncaa" onclick="switchHub('ncaa', 'games')">🏀 NCAA Predictions</button>
          <button id="subNcaaRecap" class="sub-tab" onclick="switchHub('ncaa', 'recap')">📊 NCAA Recap</button>
        </div>

        <div id="marketControls">
          <div class="search-row">
            <input id="searchInput" class="search-input" type="text" placeholder="Search player or team..." oninput="resetAndRender()" />
            <select id="filterSelect" class="filter-select" onchange="resetAndRender()">
              <option value="ALL">All Matchups</option>
              <option value="edge">High Edge Only</option>
              <option value="slip">In Slip Only</option>
            </select>
          </div>

          <div id="evChips" class="chips-row">
            <button class="f-chip active" onclick="setEvFilter('ALL', this)">ALL +EV EDGES</button>
            <button class="f-chip" onclick="setEvFilter('MAX', this)">🔥 15%+ MAX EV</button>
            <button class="f-chip" onclick="setEvFilter('PROPS', this)">NBA PROPS</button>
            <button class="f-chip" onclick="setEvFilter('NBAGAMES', this)">NBA GAMES</button>
            <button class="f-chip" onclick="setEvFilter('NCAA', this)">NCAA GAMES</button>
          </div>

          <div id="nbaChips" class="chips-row" style="display:none;">
            <button class="f-chip active" onclick="setSubFilter('ALL', this)">ALL PROPS</button>
            <button class="f-chip" onclick="setSubFilter('WATCH', this)">★ WATCHLIST</button>
            <button class="f-chip" onclick="setSubFilter('UNDERS', this)">⬇ UNDERS</button>
            <button class="f-chip" onclick="setSubFilter('ALTS', this)">🪜 ALT LADDERS</button>
            <button class="f-chip" onclick="setSubFilter('HOT', this)">🔥 8/10 STREAKS</button>
            <button class="f-chip" onclick="setSubFilter('USG', this)">⚡ USAGE BUMPS</button>
            <button class="f-chip" onclick="setSubFilter('PTS', this)">POINTS</button>
            <button class="f-chip" onclick="setSubFilter('REB', this)">REBOUNDS</button>
            <button class="f-chip" onclick="setSubFilter('AST', this)">ASSISTS</button>
            <button class="f-chip" onclick="setSubFilter('PRA', this)">PRA</button>
          </div>

          <div id="nbaGamesChips" class="chips-row" style="display:none;">
            <button class="f-chip active" onclick="setNbaGamesFilter('ALL', this)">ALL NBA GAMES</button>
            <button class="f-chip" onclick="setNbaGamesFilter('B2B', this)">💤 B2B FATIGUE</button>
            <button class="f-chip" onclick="setNbaGamesFilter('MOVES', this)">📉 LINE MOVES</button>
            <button class="f-chip" onclick="setNbaGamesFilter('TOTALS', this)">🎯 BEST TOTALS</button>
            <button class="f-chip" onclick="setNbaGamesFilter('SPREADS', this)">📊 BEST SPREADS</button>
          </div>

          <div id="ncaaChips" class="chips-row" style="display:none;">
            <button class="f-chip active" onclick="setNcaaFilter('ALL', this)">ALL NCAA PREDICTIONS</button>
            <button class="f-chip" onclick="setNcaaFilter('SPREADS', this)">📊 BEST ATS SPREADS</button>
            <button class="f-chip" onclick="setNcaaFilter('TOTALS', this)">🎯 BEST OVER/UNDERS</button>
          </div>

          <div id="recapChips" class="chips-row" style="display:none;">
            <button class="f-chip active" onclick="setRecapOutcomeFilter('ALL', this)">ALL GRADED</button>
            <button class="f-chip" onclick="setRecapOutcomeFilter('HIT', this)">✅ HITS ONLY</button>
            <button class="f-chip" onclick="setRecapOutcomeFilter('MISS', this)">❌ MISSES ONLY</button>
          </div>

          <div class="parlay-banner" id="heroParlay" style="display:none;">
            <div>
              <div class="parlay-banner-text">🎯 AI Top 4-Leg +EV Parlay</div>
              <div class="parlay-banner-sub" id="heroParlaySub">Calculating optimal edges...</div>
            </div>
            <button class="btn-quick-parlay" onclick="loadTopParlay()">+ Load 4 Legs</button>
          </div>
        </div>

        <div id="betsControls" style="display:none;">
          <div class="bets-summary">
            <div class="b-stat"><div class="b-stat-lbl">Active Risk</div><div class="b-stat-val" id="statActiveRisk" style="color:var(--cyan);">$0</div></div>
            <div class="b-stat"><div class="b-stat-lbl">Net P/L</div><div class="b-stat-val" id="statNetPL">$0</div></div>
            <div class="b-stat"><div class="b-stat-lbl">Record</div><div class="b-stat-val" id="statRecord">0-0</div></div>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span style="font-size:0.7rem; color:var(--muted);" id="livePollStatus">Live ESPN auto-tracker active (45s)</span>
            <button class="btn-sm" style="padding:4px 9px; font-size:0.7rem; border-color:var(--cyan); color:var(--cyan);" onclick="refreshTrackedBets()">⚡ Update Live Scores</button>
          </div>
        </div>

        <main class="list" id="cardsList"></main>
        <button class="load-more-btn" id="loadMoreBtn" style="display:none;" onclick="showMore()">Show More Results</button>
      </div>
    </div>
  </div>

  <!-- Mobile Fixed Bottom Navigation Bar -->
  <nav class="bottom-nav" aria-label="Mobile Navigation">
    <button id="bNavEv" class="b-nav-btn active-ev" onclick="switchHub('ev')">
      <span class="nav-ico">💎</span>
      <span>+EV (<span id="bEvCount">0</span>)</span>
    </button>
    <button id="bNavNba" class="b-nav-btn" onclick="switchHub('nba', 'props')">
      <span class="nav-ico">🏀</span>
      <span>NBA (<span id="bNbaCount">0</span>)</span>
    </button>
    <button id="bNavNcaa" class="b-nav-btn" onclick="switchHub('ncaa', 'games')">
      <span class="nav-ico">🎓</span>
      <span>NCAA (<span id="bNcaaCount">0</span>)</span>
    </button>
    <button id="bNavBets" class="b-nav-btn" onclick="switchHub('bets')">
      <span class="nav-ico">🎟️</span>
      <span>Bets (<span id="bBetsCount">0</span>)</span>
    </button>
  </nav>

  <div class="slip-bar" id="slipBar">
    <div class="slip-top">
      <div style="display:flex; align-items:center; gap:5px; flex-wrap:wrap;">
        <span style="font-size:0.74rem; font-weight:800; color:var(--emerald);">🎯 SLIP (<span id="slipCount">0</span>)</span>
        <span class="stake-box" title="Sportsbook Odds">Odds<input type="text" id="bookOddsInput" value="-110" oninput="updateSlipUI(false)" /></span>
        <span class="stake-box" title="Wager Stake">$<input type="number" id="stakeInput" value="25" min="1" oninput="updateSlipUI(false)" /></span>
        <span style="font-size:0.73rem; font-weight:800; color:var(--cyan);" id="slipPayout">→ $48</span>
      </div>
      <div style="display:flex; gap:5px;">
        <button class="btn-quick-parlay" style="padding:4px 8px; font-size:0.7rem;" onclick="saveTrackedBet()">📌 Track</button>
        <button id="shareSlipBtn" class="btn-sm" style="padding:3px 8px; font-size:0.7rem; border-color:var(--cyan); color:var(--cyan);" onclick="shareCurrentSlip()">📤 Share</button>
        <button class="btn-sm" style="padding:3px 7px; font-size:0.7rem;" onclick="clearSlip()">×</button>
      </div>
    </div>
    <div class="kelly-row">
      <div style="display:flex; align-items:center; gap:5px;">
        <span style="color:var(--sub); font-weight:700;">Bankroll</span>
        <span class="stake-box">$<input type="number" id="bankrollInput" value="500" min="10" oninput="saveBankrollAndCalc()" /></span>
        <select id="kellyFracSelect" style="background:#0a0e14; border:1px solid var(--border); color:#fff; border-radius:5px; padding:2px 4px; font-size:0.68rem; font-weight:700;" onchange="updateSlipUI(false)">
          <option value="0.25" selected>1/4 Kelly</option>
          <option value="0.5">1/2 Kelly</option>
          <option value="1.0">Full Kelly</option>
        </select>
      </div>
      <button id="kellyApplyBtn" class="kelly-pill" onclick="applyKellyStake()">⚡ Kelly: $0 (0%)</button>
    </div>
    <div class="book-row">
      <div style="display:flex; align-items:center; gap:5px;">
        <span style="color:var(--sub); font-weight:700;">Platform</span>
        <select id="sportsbookSelect" class="book-sel" onchange="savePreferredBook()">
          <option value="pp">PrizePicks (Pick'em)</option>
          <option value="ud">Underdog (Pick'em)</option>
          <option value="dk">DraftKings Sportsbook</option>
          <option value="pk6">DraftKings Pick6</option>
          <option value="fd">FanDuel Sportsbook</option>
          <option value="hr">Hard Rock Bet</option>
          <option value="mgm">BetMGM</option>
          <option value="sl">Sleeper Picks</option>
          <option value="betr">Betr Picks</option>
        </select>
      </div>
      <button id="openBookBtn" class="btn-book" onclick="openSportsbookWithSlip()">🚀 Copy & Open App</button>
    </div>
    <div class="slip-chips" id="slipChips"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
