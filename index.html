<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#07090d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SimLab" />
  <link rel="icon" type="image/jpeg" href="./icon-512.png.jpeg" />
  <link rel="apple-touch-icon" href="./icon-512.png.jpeg" />
  <link rel="manifest" href="./manifest.json" />
  <title>SimLab | Mobile Sports Terminal</title>
  <style>
    :root {
      --bg: #07090d;
      --card: #0e131a;
      --card-hi: #141b24;
      --border: #1c2532;
      --text: #f8fafc;
      --sub: #94a3b8;
      --muted: #64748b;
      --emerald: #10b981;
      --emerald-dim: rgba(16, 185, 129, 0.16);
      --orange: #f97316;
      --orange-dim: rgba(249, 115, 22, 0.16);
      --cyan: #38bdf8;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.35;
      padding-bottom: 32px;
      -webkit-font-smoothing: antialiased;
    }

    body.has-slip { padding-bottom: 115px; }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 12px;
    }

    /* Non-sticky Header so 100% of screen scrolls freely */
    header {
      padding: 12px 0 10px;
      border-bottom: 1px solid var(--border);
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand img {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      object-fit: cover;
    }

    .brand-title {
      font-size: 0.98rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .sync-sub {
      font-size: 0.68rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--emerald);
    }

    .btn-sm {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--sub);
      padding: 6px 10px;
      border-radius: 7px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Compact Segmented Switcher */
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: #0b0e14;
      padding: 3px;
      border-radius: 9px;
      border: 1px solid var(--border);
    }

    .tab {
      border: none;
      background: transparent;
      color: var(--sub);
      padding: 7px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .tab.active-nba { background: var(--orange); color: #fff; }
    .tab.active-ncaa { background: var(--emerald); color: #03150a; }

    /* Compact Single-Row Search & Filter */
    .toolbar {
      display: flex;
      gap: 6px;
      margin: 10px 0 8px;
    }

    .search-in {
      flex: 1;
      min-width: 0;
      background: var(--card);
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      outline: none;
    }

    .filter-sel {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 8px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      max-width: 138px;
    }

    /* Horizontal Scrollable Stat Chips */
    .chip-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .chip-strip::-webkit-scrollbar { display: none; }

    .f-chip {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--sub);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .f-chip.active {
      background: var(--emerald-dim);
      border-color: var(--emerald);
      color: var(--emerald);
    }

    /* Collapsible AI 4-Leg Parlay Pill */
    .parlay-banner {
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.12), rgba(14, 19, 26, 0.95));
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 10px;
      padding: 9px 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .parlay-banner-text {
      font-size: 0.76rem;
      font-weight: 700;
      color: #fff;
    }

    .parlay-banner-sub {
      font-size: 0.68rem;
      color: var(--emerald);
      font-weight: 600;
    }

    .btn-quick-parlay {
      background: var(--emerald);
      color: #03150a;
      border: none;
      padding: 6px 10px;
      border-radius: 7px;
      font-size: 0.72rem;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }

    /* Ultra-Compact Cards */
    .list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 8px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card.in-slip { border-color: var(--emerald); }

    .c-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .c-name {
      font-size: 0.92rem;
      font-weight: 700;
      color: #fff;
    }

    .c-meta {
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 600;
    }

    .usg-tag {
      background: var(--orange-dim);
      color: var(--orange);
      border: 1px solid rgba(249, 115, 22, 0.35);
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 0.66rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .edge-tag {
      background: var(--emerald-dim);
      color: var(--emerald);
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 0.66rem;
      font-weight: 800;
      white-space: nowrap;
    }

    /* 2x2 Tight Prop Grid per Player */
    .prop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .p-btn {
      background: #131922;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 9px;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .p-btn .sim-hint {
      display: block;
      font-size: 0.63rem;
      color: var(--muted);
      font-weight: 500;
    }

    .p-btn .prob-val {
      font-weight: 800;
      color: var(--sub);
    }

    .p-btn.hot .prob-val { color: var(--emerald); }

    .p-btn.selected {
      background: var(--emerald-dim);
      border-color: var(--emerald);
    }

    .p-btn.selected .prob-val { color: var(--emerald); }

    /* Compact NCAA Matchup Row */
    .ncaa-scores {
      display: flex;
      justify-content: space-between;
      background: #0a0e14;
      padding: 6px 9px;
      border-radius: 7px;
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
    }

    .load-more-btn {
      width: 100%;
      margin-top: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px;
      border-radius: 9px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Auto-Hiding Floating Slip Drawer */
    .slip-bar {
      position: fixed;
      bottom: 10px;
      left: 10px;
      right: 10px;
      max-width: 1076px;
      margin: 0 auto;
      background: rgba(13, 18, 26, 0.97);
      border: 1px solid var(--emerald);
      border-radius: 12px;
      padding: 10px 12px;
      z-index: 50;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    body.has-slip .slip-bar { display: flex; }

    .slip-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slip-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .slip-chips::-webkit-scrollbar { display: none; }

    .s-chip {
      background: #18212e;
      border: 1px solid var(--border);
      color: #fff;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .s-chip span { color: var(--danger); font-weight: 900; cursor: pointer; }
  </style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="top-row">
      <div class="brand">
        <img src="./icon-512.png.jpeg" alt="SimLab" onerror="this.style.display='none'" />
        <div>
          <div class="brand-title">SimLab Command Center</div>
          <div class="sync-sub"><span class="dot"></span><span id="syncText">Syncing live slates...</span></div>
        </div>
      </div>
      <div style="display:flex; gap:6px;">
        <button id="installBtn" class="btn-sm" style="display:none; border-color:var(--emerald); color:var(--emerald);">📲 Install</button>
        <button class="btn-sm" onclick="loadAllData(true)">↻ Sync</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active-nba" id="tabNba" onclick="switchSport('nba')">🔥 NBA Props (<span id="nbaCount">0</span>)</button>
      <button class="tab" id="tabNcaa" onclick="switchSport('ncaa')">🏀 NCAA Slate (<span id="ncaaCount">0</span>)</button>
    </div>
  </header>

  <div class="toolbar">
    <input type="text" id="searchInput" class="search-in" placeholder="Search player or team..." oninput="resetAndRender()" />
    <select id="filterSelect" class="filter-sel" onchange="resetAndRender()">
      <option value="all">All Matchups</option>
      <option value="edge">Top Edges Only</option>
      <option value="slip">In My Slip</option>
    </select>
  </div>

  <div class="chip-strip" id="nbaChips">
    <button class="f-chip active" onclick="setSubFilter('ALL', this)">ALL PLAYERS</button>
    <button class="f-chip" onclick="setSubFilter('USG', this)">⚡ USAGE BUMPS</button>
    <button class="f-chip" onclick="setSubFilter('PTS', this)">POINTS</button>
    <button class="f-chip" onclick="setSubFilter('REB', this)">REBOUNDS</button>
    <button class="f-chip" onclick="setSubFilter('AST', this)">ASSISTS</button>
    <button class="f-chip" onclick="setSubFilter('PRA', this)">PRA</button>
  </div>

  <div class="parlay-banner" id="heroParlay" style="display:none;">
    <div>
      <div class="parlay-banner-text">🎯 AI Top 4-Leg Edge Parlay</div>
      <div class="parlay-banner-sub" id="heroParlaySub">Calculating optimal edges...</div>
    </div>
    <button class="btn-quick-parlay" onclick="loadTopParlay()">+ Load 4 Legs</button>
  </div>

  <main class="list" id="cardsList"></main>
  <button class="load-more-btn" id="loadMoreBtn" style="display:none;" onclick="showMore()">Show More Results</button>
</div>

<!-- Auto-Hiding Floating Slip Drawer -->
<div class="slip-bar" id="slipBar">
  <div class="slip-top">
    <div style="font-size:0.76rem; font-weight:800; color:var(--emerald);">
      🎯 PARLAY SLIP (<span id="slipCount">0</span>) • <span id="slipOdds" style="color:#fff;">0.0%</span>
    </div>
    <button class="btn-sm" style="padding:3px 8px; font-size:0.7rem;" onclick="clearSlip()">Clear</button>
  </div>
  <div class="slip-chips" id="slipChips"></div>
</div>

<script>
  const GITHUB_USER = "RockoDevXda";
  const NCAA_JSON_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/ncaa-sim/main/daily_slate.json`;
  const NBA_JSON_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/nba-props-sim/main/nba_props_slate.json`;

  let activeSport = "nba";
  let subFilter = "ALL";
  let visibleLimit = 25;
  let ncaaGames = [];
  let nbaPlayers = [];
  let topParlayLegs = [];
  let slip = [];
  let deferredPrompt = null;

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById("installBtn").style.display = "inline-block";
  });

  document.getElementById("installBtn").addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById("installBtn").style.display = "none";
  });

  function probToAmerican(pct) {
    const p = pct / 100;
    if (p <= 0 || p >= 1) return "N/A";
    return p >= 0.5 ? `${Math.round(-100 * p / (1 - p))}` : `+${Math.round(100 * (1 - p) / p)}`;
  }

  function switchSport(sport) {
    activeSport = sport;
    visibleLimit = 25;
    document.getElementById("tabNba").className = sport === "nba" ? "tab active-nba" : "tab";
    document.getElementById("tabNcaa").className = sport === "ncaa" ? "tab active-ncaa" : "tab";
    document.getElementById("nbaChips").style.display = sport === "nba" ? "flex" : "none";
    render();
  }

  function setSubFilter(val, btn) {
    subFilter = val;
    visibleLimit = 25;
    document.querySelectorAll(".f-chip").forEach(c => c.classList.remove("active"));
    btn.classList.add("active");
    render();
  }

  function resetAndRender() {
    visibleLimit = 25;
    render();
  }

  function showMore() {
    visibleLimit += 25;
    render();
  }

  function toggleSlip(key, label, prob) {
    const idx = slip.findIndex(s => s.key === key);
    if (idx !== -1) {
      slip.splice(idx, 1);
    } else {
      slip.push({ key, label, prob });
    }
    updateSlipUI();
    render();
  }

  function clearSlip() {
    slip = [];
    updateSlipUI();
    render();
  }

  function loadTopParlay() {
    if (!topParlayLegs.length) return;
    slip = topParlayLegs.map(x => ({ ...x }));
    updateSlipUI();
    render();
  }

  function updateSlipUI() {
    const has = slip.length > 0;
    document.body.classList.toggle("has-slip", has);
    if (!has) return;

    let comb = 1.0;
    slip.forEach(s => { comb *= (s.prob / 100); });
    const pct = +(comb * 100).toFixed(1);

    document.getElementById("slipCount").textContent = slip.length;
    document.getElementById("slipOdds").textContent = `${pct}% (${probToAmerican(pct)})`;
    document.getElementById("slipChips").innerHTML = slip.map(s => `
      <div class="s-chip">${s.label} (${s.prob}%) <span onclick="toggleSlip('${s.key}')">×</span></div>
    `).join("");
  }

  function buildTopParlay() {
    const legs = [];
    const usedGames = new Set();

    const sortedNba = [...nbaPlayers].sort((a, b) => (b.best_prop?.prob || 0) - (a.best_prop?.prob || 0));
    for (const p of sortedNba) {
      if (legs.length >= 2) break;
      const gKey = p.game_id || `${p.team}-${p.opponent}`;
      if (!usedGames.has(gKey) && p.best_prop) {
        legs.push({
          key: `nba-${p.id}-${p.best_prop.stat}`,
          label: `${p.player} ${p.best_prop.market}`,
          prob: p.best_prop.prob
        });
        usedGames.add(gKey);
      }
    }

    const sortedNcaa = [...ncaaGames]
      .filter(g => g.has_line)
      .sort((a, b) => (b.spread_cover_pct || 0) - (a.spread_cover_pct || 0));

    for (const g of sortedNcaa) {
      if (legs.length >= 4) break;
      legs.push({
        key: `ncaa-${g.id}-ats`,
        label: g.spread_pick,
        prob: g.spread_cover_pct
      });
    }

    topParlayLegs = legs;
    const banner = document.getElementById("heroParlay");
    if (legs.length < 2) {
      banner.style.display = "none";
      return;
    }

    let c = 1.0;
    legs.forEach(l => { c *= (l.prob / 100); });
    const pct = +(c * 100).toFixed(1);
    banner.style.display = "flex";
    document.getElementById("heroParlaySub").textContent =
      `${legs.map(l => l.label).join(" • ")} (${pct}% | ${probToAmerican(pct)})`;
  }

  function render() {
    const listEl = document.getElementById("cardsList");
    const moreBtn = document.getElementById("loadMoreBtn");
    const q = document.getElementById("searchInput").value.toLowerCase().trim();
    const filter = document.getElementById("filterSelect").value;

    if (activeSport === "nba") {
      const sorted = [...nbaPlayers].sort((a, b) => {
        if (["PTS", "REB", "AST", "PRA"].includes(subFilter)) {
          const pa = a.all_props?.find(x => x.stat === subFilter)?.prob || 0;
          const pb = b.all_props?.find(x => x.stat === subFilter)?.prob || 0;
          return pb - pa;
        }
        return (b.best_prop?.prob || 0) - (a.best_prop?.prob || 0);
      });

      const filtered = sorted.filter(p => {
        const matchQ = !q || p.player.toLowerCase().includes(q) || p.team.toLowerCase().includes(q) || p.opponent.toLowerCase().includes(q);
        if (!matchQ) return false;
        if (subFilter === "USG" && (p.usage_bump_pct || 0) <= 0) return false;
        if (filter === "edge" && (p.best_prop?.prob || 0) < 58 && (p.usage_bump_pct || 0) <= 0) return false;
        if (filter === "slip" && !slip.some(s => s.key.startsWith(`nba-${p.id}`))) return false;
        return true;
      });

      const slice = filtered.slice(0, visibleLimit);
      moreBtn.style.display = filtered.length > visibleLimit ? "block" : "none";
      moreBtn.textContent = `Show More (${filtered.length - visibleLimit} remaining)`;

      listEl.innerHTML = slice.map(p => {
        const inSlip = slip.some(s => s.key.startsWith(`nba-${p.id}`));
        const propsToShow = ["PTS", "REB", "AST", "PRA"].includes(subFilter)
          ? (p.all_props || []).filter(m => m.stat === subFilter)
          : (p.all_props || []);

        return `
          <article class="card ${inSlip ? 'in-slip' : ''}">
            <div class="c-head">
              <div>
                <div class="c-name">${p.player} <span class="c-meta">• ${p.team} vs ${p.opponent} (${p.avg_min}m)</span></div>
              </div>
              ${p.usage_bump_pct > 0
                ? `<span class="usg-tag">⚡ +${p.usage_bump_pct}% Usg</span>`
                : `<span class="c-meta">O/U ${p.game_total}</span>`}
            </div>
            <div class="prop-grid" style="${propsToShow.length === 1 ? 'grid-template-columns:1fr;' : ''}">
              ${propsToShow.map(m => {
                const k = `nba-${p.id}-${m.stat}`;
                const sel = slip.some(s => s.key === k);
                const hot = m.prob >= 60;
                return `
                  <button class="p-btn ${sel ? 'selected' : ''} ${hot ? 'hot' : ''}" onclick="toggleSlip('${k}','${p.player} ${m.market}',${m.prob})">
                    <div>
                      <span>${m.market}</span>
                      <span class="sim-hint">Sim: ${m.proj}</span>
                    </div>
                    <span class="prob-val">${m.prob}%</span>
                  </button>
                `;
              }).join("")}
            </div>
          </article>
        `;
      }).join("");
    } else {
      const sorted = [...ncaaGames].sort((a, b) => (b.spread_cover_pct || b.favored_prob || 0) - (a.spread_cover_pct || a.favored_prob || 0));
      const filtered = sorted.filter(g => {
        const matchQ = !q || g.away_team.toLowerCase().includes(q) || g.home_team.toLowerCase().includes(q);
        if (!matchQ) return false;
        if (filter === "edge" && (g.spread_cover_pct || 0) < 57 && (g.favored_prob || 0) < 70) return false;
        if (filter === "slip" && !slip.some(s => s.key.startsWith(`ncaa-${g.id}`))) return false;
        return true;
      });

      const slice = filtered.slice(0, visibleLimit);
      moreBtn.style.display = filtered.length > visibleLimit ? "block" : "none";
      moreBtn.textContent = `Show More (${filtered.length - visibleLimit} remaining)`;

      listEl.innerHTML = slice.map(g => {
        const atsKey = `ncaa-${g.id}-ats`;
        const mlKey = `ncaa-${g.id}-ml`;
        const atsSel = slip.some(s => s.key === atsKey);
        const mlSel = slip.some(s => s.key === mlKey);

        return `
          <article class="card ${(atsSel || mlSel) ? 'in-slip' : ''}">
            <div class="c-head">
              <div>
                <div class="c-name">${g.away_short} @ ${g.home_short}</div>
                <div class="c-meta">${g.tipoff || ''} • Line: ${g.market_line || 'PK'}</div>
              </div>
              ${g.has_line ? `<span class="edge-tag">+${g.edge_pts} pt edge</span>` : ''}
            </div>
            <div class="ncaa-scores">
              <span><strong>${g.away_short}</strong> ${g.away_proj} (${g.away_win_pct}%)</span>
              <span><strong>${g.home_short}</strong> ${g.home_proj} (${g.home_win_pct}%)</span>
            </div>
            <div class="prop-grid">
              ${g.has_line
                ? `<button class="p-btn ${atsSel ? 'selected' : ''} ${g.spread_cover_pct >= 58 ? 'hot' : ''}" onclick="toggleSlip('${atsKey}','${g.spread_pick}',${g.spread_cover_pct})">
                    <span>${g.spread_pick}</span>
                    <span class="prob-val">${g.spread_cover_pct}%</span>
                   </button>`
                : `<button class="p-btn" disabled><span>No Spread</span></button>`}
              <button class="p-btn ${mlSel ? 'selected' : ''} ${g.favored_prob >= 70 ? 'hot' : ''}" onclick="toggleSlip('${mlKey}','${g.favored_team} ML',${g.favored_prob})">
                <span>${g.favored_team} ML</span>
                <span class="prob-val">${g.favored_prob}%</span>
              </button>
            </div>
          </article>
        `;
      }).join("");
    }
  }

  async function loadAllData(force = false) {
    const bust = force ? `?t=${Date.now()}` : `?t=${Math.floor(Date.now() / 60000)}`;
    document.getElementById("syncText").textContent = "Syncing...";
    try {
      const [ncaaRes, nbaRes] = await Promise.allSettled([
        fetch(NCAA_JSON_URL + bust),
        fetch(NBA_JSON_URL + bust)
      ]);
      if (ncaaRes.status === "fulfilled" && ncaaRes.value.ok) ncaaGames = await ncaaRes.value.json();
      if (nbaRes.status === "fulfilled" && nbaRes.value.ok) nbaPlayers = await nbaRes.value.json();

      document.getElementById("ncaaCount").textContent = ncaaGames.length;
      document.getElementById("nbaCount").textContent = nbaPlayers.length;
      const ts = ncaaGames[0]?.generated_at || nbaPlayers[0]?.generated_at || "Live";
      document.getElementById("syncText").textContent = `Synced • ${ts}`;

      buildTopParlay();
      render();
    } catch (e) {
      document.getElementById("syncText").textContent = "Offline cache";
    }
  }

  loadAllData();
</script>
</body>
</html>
