<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#080a0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SimLab" />
  <link rel="icon" type="image/jpeg" href="./icon-512.png.jpeg" />
  <link rel="apple-touch-icon" href="./icon-512.png.jpeg" />
  <link rel="manifest" href="./manifest.json" />
  <title>SimLab Command Center | NCAA & NBA</title>
  <style>
    :root {
      --bg: #080a0d;
      --surface: #0e1217;
      --surface-hover: #131820;
      --input-bg: #0c1015;
      --border: #1b222c;
      --border-light: #26303e;
      --text: #f1f5f9;
      --muted: #64748b;
      --subtext: #94a3b8;
      --emerald: #10b981;
      --emerald-bright: #22c55e;
      --emerald-dim: rgba(16, 185, 129, 0.14);
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding-bottom: 92px;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Header */
    header {
      background: rgba(8, 10, 13, 0.94);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px 14px;
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(12px);
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--emerald-bright);
      color: #04130a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1rem;
      overflow: hidden;
      flex-shrink: 0;
    }

    .brand-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-title {
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #fff;
    }

    .brand-title span {
      color: var(--muted);
      font-weight: 500;
    }

    .sync-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .sync-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--emerald-bright);
      box-shadow: 0 0 8px var(--emerald-bright);
    }

    .sync-label {
      color: var(--emerald-bright);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-ghost {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .btn-ghost:hover {
      border-color: var(--border-light);
      color: #fff;
    }

    /* Sport Pill Tabs */
    .tab-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .sport-pill {
      border: 1px solid transparent;
      background: transparent;
      color: var(--subtext);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }

    .sport-pill:hover {
      color: #fff;
      background: var(--surface);
    }

    .sport-pill.active {
      background: var(--emerald-bright);
      color: #03150a;
      font-weight: 700;
    }

    .pill-count {
      background: rgba(255, 255, 255, 0.08);
      color: var(--subtext);
      padding: 1px 7px;
      border-radius: 5px;
      font-size: 0.72rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .sport-pill.active .pill-count {
      background: rgba(0, 0, 0, 0.22);
      color: #03150a;
    }

    /* KPI Summary Strip */
    .kpi-strip {
      max-width: 1440px;
      margin: 20px auto 16px;
      padding: 0 24px;
    }

    .kpi-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
    }

    .kpi-cell {
      padding: 16px 20px;
      border-right: 1px solid var(--border);
    }

    .kpi-cell:last-child {
      border-right: none;
    }

    .kpi-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .kpi-val {
      font-size: 1.45rem;
      font-weight: 700;
      color: #fff;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    .kpi-val.muted-val {
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--muted);
      padding-top: 6px;
    }

    .kpi-val.emerald-val {
      color: var(--emerald-bright);
    }

    /* Filter & Search Bar */
    .filter-bar {
      max-width: 1440px;
      margin: 0 auto 18px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-wrap {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px 10px 38px;
      border-radius: 9px;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-input:focus {
      border-color: var(--border-light);
    }

    .filter-select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 34px 10px 14px;
      border-radius: 9px;
      font-size: 0.85rem;
      min-width: 210px;
      outline: none;
      cursor: pointer;
    }

    .count-indicator {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--muted);
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
      margin-left: 4px;
    }

    /* Cards Grid */
    .cards-grid {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .prop-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: border-color 0.15s, background 0.15s;
    }

    .prop-card:hover {
      border-color: var(--border-light);
      background: var(--surface-hover);
    }

    .prop-card.in-slip {
      border-color: var(--emerald-bright);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .entity-title {
      font-size: 0.96rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }

    .entity-sub {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 3px;
    }

    .badges-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
      flex-shrink: 0;
    }

    .stat-tag {
      background: #161c24;
      border: 1px solid var(--border-light);
      color: var(--subtext);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 5px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .edge-tag {
      background: #131920;
      border: 1px solid var(--border-light);
      color: var(--subtext);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 6px;
      font-variant-numeric: tabular-nums;
    }

    .edge-tag.hot {
      color: var(--emerald-bright);
      border-color: rgba(34, 197, 94, 0.35);
      background: rgba(34, 197, 94, 0.08);
    }

    /* 3-Column Metrics Row (LINE | MODEL | HIT) */
    .metrics-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: end;
      padding-top: 2px;
    }

    .metric-col:nth-child(2) { text-align: center; }
    .metric-col:nth-child(3) { text-align: right; }

    .metric-lbl {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .metric-num {
      font-size: 1.32rem;
      font-weight: 700;
      color: #fff;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    .metric-num.model-val {
      color: var(--emerald-bright);
    }

    .metric-num.hit-val {
      font-size: 1.05rem;
      color: var(--subtext);
      font-weight: 600;
    }

    /* Dual Action Buttons (+ Over | + Under) */
    .action-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .bet-btn {
      background: #131820;
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 8px 11px;
      border-radius: 7px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s;
      font-variant-numeric: tabular-nums;
    }

    .bet-btn:hover {
      border-color: var(--border-light);
      color: #fff;
      background: #181f29;
    }

    .bet-btn .pct {
      color: var(--muted);
      font-weight: 600;
    }

    .bet-btn.selected {
      background: var(--emerald-dim);
      border-color: var(--emerald-bright);
      color: #fff;
    }

    .bet-btn.selected .pct {
      color: var(--emerald-bright);
      font-weight: 700;
    }

    /* Sticky Bottom Cross-Sport Slip Bar */
    .slip-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(11, 14, 19, 0.96);
      border-top: 1px solid var(--border);
      padding: 12px 24px;
      z-index: 50;
      backdrop-filter: blur(12px);
    }

    .slip-dock-inner {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .slip-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .slip-badge {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      background: var(--emerald-bright);
      color: #03150a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .slip-title-block .stitle {
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #fff;
      text-transform: uppercase;
    }

    .slip-title-block .ssub {
      font-size: 0.76rem;
      color: var(--muted);
    }

    .chip-list {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .slip-chip {
      background: #141a22;
      border: 1px solid var(--emerald-bright);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .slip-chip button {
      background: none;
      border: none;
      color: var(--danger);
      font-weight: 800;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .slip-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .combined-box {
      text-align: right;
    }

    .combined-lbl {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .combined-val {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--emerald-bright);
      font-variant-numeric: tabular-nums;
    }

    .empty-box {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 20px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 12px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    @media (max-width: 1080px) {
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
      .kpi-box { grid-template-columns: repeat(3, 1fr); }
      .kpi-cell { border-bottom: 1px solid var(--border); }
    }

    @media (max-width: 680px) {
      header, .kpi-strip, .filter-bar, .cards-grid, .slip-dock { padding-left: 14px; padding-right: 14px; }
      .cards-grid { grid-template-columns: 1fr; }
      .kpi-box { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<header>
  <div class="container">
    <div class="top-bar">
      <div class="brand-group">
        <div class="brand-icon">
          <img src="./icon-512.png.jpeg" alt="SimLab" onerror="this.remove()" />
        </div>
        <div>
          <div class="brand-title">SimLab <span>Command Center</span></div>
          <div class="sync-line">
            <span class="sync-dot"></span>
            <span class="sync-label">SYNCED</span>
            <span>•</span>
            <span id="lastSyncText">Loading live slates...</span>
          </div>
        </div>
      </div>

      <div class="header-actions">
        <button id="installBtn" class="btn-ghost" style="display:none; border-color:var(--emerald-bright); color:var(--emerald-bright);">📲 Install App</button>
        <button class="btn-ghost" onclick="loadAllData(true)">↻ Sync</button>
      </div>
    </div>

    <div class="tab-row">
      <button class="sport-pill" id="tabNcaa" onclick="switchSport('ncaa')">
        <span>📈 NCAA D1 Slate</span>
        <span class="pill-count" id="ncaaCount">0</span>
      </button>
      <button class="sport-pill active" id="tabNba" onclick="switchSport('nba')">
        <span>🔥 NBA Player Props</span>
        <span class="pill-count" id="nbaCount">0</span>
      </button>
    </div>
  </div>
</header>

<section class="kpi-strip">
  <div class="kpi-box">
    <div class="kpi-cell">
      <div class="kpi-label">SLATE GAMES</div>
      <div class="kpi-val" id="kpiGames">0</div>
    </div>
    <div class="kpi-cell">
      <div class="kpi-label" id="kpiSecondLabel">NBA PROPS</div>
      <div class="kpi-val" id="kpiProps">0</div>
    </div>
    <div class="kpi-cell">
      <div class="kpi-label">AVG EDGE</div>
      <div class="kpi-val" id="kpiAvgEdge">0.0 pt</div>
    </div>
    <div class="kpi-cell">
      <div class="kpi-label">TOP EDGES</div>
      <div class="kpi-val" id="kpiTopEdges">0</div>
    </div>
    <div class="kpi-cell">
      <div class="kpi-label">SLIP HIT RATE</div>
      <div class="kpi-val muted-val" id="kpiSlipRate">— 0 picks</div>
    </div>
  </div>
</section>

<section class="filter-bar">
  <div class="search-wrap">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="text" id="searchInput" class="search-input" placeholder="Search team, player or venue" oninput="render()" />
  </div>

  <select id="filterSelect" class="filter-select" onchange="render()">
    <option value="all">All matchup / players</option>
    <option value="top">Top model edges (≥ 58%)</option>
    <option value="slip">On cross-sport slip</option>
  </select>

  <span class="count-indicator" id="visibleCount">0 / 0 PROPS</span>
</section>

<main class="cards-grid" id="cardsGrid"></main>

<div class="slip-dock">
  <div class="slip-dock-inner">
    <div class="slip-left">
      <div class="slip-badge">⚡</div>
      <div class="slip-title-block">
        <div class="stitle">CROSS-SPORT SLIP</div>
        <div class="ssub" id="slipHint">Tap any pick to build an NCAA + NBA parlay</div>
      </div>
      <div class="chip-list" id="slipChips"></div>
    </div>

    <div class="slip-right">
      <div class="combined-box">
        <div class="combined-lbl">COMBINED HIT RATE</div>
        <div class="combined-val" id="combinedOdds">0.0% (N/A)</div>
      </div>
      <button class="btn-ghost" id="clearSlipBtn" style="display:none;" onclick="clearSlip()">Clear</button>
    </div>
  </div>
</div>

<script>
  const GITHUB_USER = "RockoDevXda";
  const NCAA_JSON_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/ncaa-sim/main/daily_slate.json`;
  const NBA_JSON_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/nba-props-sim/main/nba_props_slate.json`;

  let activeSport = "nba";
  let ncaaGames = [];
  let nbaCards = [];
  let slip = [];
  let deferredPrompt = null;

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById("installBtn").style.display = "inline-flex";
  });

  document.getElementById("installBtn").addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById("installBtn").style.display = "none";
  });

  function probToAmerican(pct) {
    const p = pct / 100;
    if (p <= 0 || p >= 1) return "N/A";
    return p >= 0.5 ? `${Math.round(-100 * p / (1 - p))}` : `+${Math.round(100 * (1 - p) / p)}`;
  }

  function switchSport(sport) {
    activeSport = sport;
    document.getElementById("tabNcaa").classList.toggle("active", sport === "ncaa");
    document.getElementById("tabNba").classList.toggle("active", sport === "nba");
    updateKPIs();
    render();
  }

  function toggleSlip(key, label, prob) {
    const idx = slip.findIndex(s => s.key === key);
    if (idx !== -1) {
      slip.splice(idx, 1);
    } else {
      slip.push({ key, label, prob });
    }
    updateSlipUI();
    updateKPIs();
    render();
  }

  function clearSlip() {
    slip = [];
    updateSlipUI();
    updateKPIs();
    render();
  }

  function updateSlipUI() {
    const chipsEl = document.getElementById("slipChips");
    const hintEl = document.getElementById("slipHint");
    const combEl = document.getElementById("combinedOdds");
    const clearBtn = document.getElementById("clearSlipBtn");

    if (slip.length === 0) {
      chipsEl.innerHTML = "";
      hintEl.style.display = "block";
      combEl.textContent = "0.0% (N/A)";
      clearBtn.style.display = "none";
      return;
    }

    hintEl.style.display = "none";
    clearBtn.style.display = "inline-flex";

    let combined = 1.0;
    slip.forEach(s => { combined *= (s.prob / 100); });
    const pct = +(combined * 100).toFixed(1);
    combEl.textContent = `${pct}% (${probToAmerican(pct)})`;

    chipsEl.innerHTML = slip.map(s => `
      <div class="slip-chip">
        <span>${s.label} (${s.prob}%)</span>
        <button onclick="toggleSlip('${s.key}')">×</button>
      </div>
    `).join("");
  }

  function updateKPIs() {
    document.getElementById("kpiGames").textContent = ncaaGames.length;
    const slipRateEl = document.getElementById("kpiSlipRate");

    if (slip.length > 0) {
      let c = 1.0;
      slip.forEach(s => { c *= (s.prob / 100); });
      const pct = +(c * 100).toFixed(1);
      slipRateEl.className = "kpi-val emerald-val";
      slipRateEl.textContent = `${pct}% (${slip.length} picks)`;
    } else {
      slipRateEl.className = "kpi-val muted-val";
      slipRateEl.textContent = "— 0 picks";
    }

    if (activeSport === "nba") {
      document.getElementById("kpiSecondLabel").textContent = "NBA PROPS";
      document.getElementById("kpiProps").textContent = nbaCards.length;
      const avg = nbaCards.length
        ? (nbaCards.reduce((acc, c) => acc + c.edgePts, 0) / nbaCards.length).toFixed(1)
        : "0.0";
      document.getElementById("kpiAvgEdge").textContent = `${avg} pt`;
      document.getElementById("kpiTopEdges").textContent = nbaCards.filter(c => c.bestProb >= 58).length;
    } else {
      document.getElementById("kpiSecondLabel").textContent = "NCAA LINES";
      const lined = ncaaGames.filter(g => g.has_line);
      document.getElementById("kpiProps").textContent = lined.length;
      const avg = lined.length
        ? (lined.reduce((acc, g) => acc + (g.edge_pts || 0), 0) / lined.length).toFixed(1)
        : "0.0";
      document.getElementById("kpiAvgEdge").textContent = `${avg} pt`;
      document.getElementById("kpiTopEdges").textContent = lined.filter(g => (g.spread_cover_pct || 0) >= 58).length;
    }
  }

  function render() {
    const grid = document.getElementById("cardsGrid");
    const q = document.getElementById("searchInput").value.toLowerCase().trim();
    const filter = document.getElementById("filterSelect").value;

    if (activeSport === "nba") {
      const filtered = nbaCards.filter(c => {
        const matchQ = !q ||
          c.player.toLowerCase().includes(q) ||
          c.team.toLowerCase().includes(q) ||
          c.opponent.toLowerCase().includes(q) ||
          c.stat.toLowerCase().includes(q);
        if (!matchQ) return false;
        if (filter === "top") return c.bestProb >= 58;
        if (filter === "slip") return slip.some(s => s.key.startsWith(c.baseKey));
        return true;
      });

      document.getElementById("visibleCount").textContent = `${filtered.length} / ${nbaCards.length} PROPS`;

      if (!filtered.length) {
        grid.innerHTML = `<div class="empty-box">No NBA player props match your current filter.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(c => {
        const overKey = `${c.baseKey}-over`;
        const underKey = `${c.baseKey}-under`;
        const overSel = slip.some(s => s.key === overKey);
        const underSel = slip.some(s => s.key === underKey);
        const isHot = c.edgePts >= 1.5;

        return `
          <article class="prop-card ${(overSel || underSel) ? 'in-slip' : ''}">
            <div class="card-header">
              <div>
                <div class="entity-title">${c.player}</div>
                <div class="entity-sub">${c.team} VS ${c.opponent}</div>
              </div>
              <div class="badges-col">
                <span class="stat-tag">${c.stat}</span>
                <span class="edge-tag ${isHot ? 'hot' : ''}">+${c.edgePts.toFixed(1)} pt edge</span>
              </div>
            </div>

            <div class="metrics-row">
              <div class="metric-col">
                <div class="metric-lbl">LINE</div>
                <div class="metric-num">${c.line}</div>
              </div>
              <div class="metric-col">
                <div class="metric-lbl">MODEL</div>
                <div class="metric-num model-val">${c.proj}</div>
              </div>
              <div class="metric-col">
                <div class="metric-lbl">HIT</div>
                <div class="metric-num hit-val">${c.hitRate10}/10</div>
              </div>
            </div>

            <div class="action-pair">
              <button class="bet-btn ${overSel ? 'selected' : ''}" onclick="toggleSlip('${overKey}','${c.player} O ${c.line} ${c.stat}',${c.overProb})">
                <span>+ Over ${c.line}</span>
                <span class="pct">${c.overProb.toFixed(1)}%</span>
              </button>
              <button class="bet-btn ${underSel ? 'selected' : ''}" onclick="toggleSlip('${underKey}','${c.player} U ${c.line} ${c.stat}',${c.underProb})">
                <span>+ Under ${c.line}</span>
                <span class="pct">${c.underProb.toFixed(1)}%</span>
              </button>
            </div>
          </article>
        `;
      }).join("");
    } else {
      const sortedNcaa = [...ncaaGames].sort((a, b) => (b.edge_pts || 0) - (a.edge_pts || 0));
      const filtered = sortedNcaa.filter(g => {
        const matchQ = !q ||
          g.away_team.toLowerCase().includes(q) ||
          g.home_team.toLowerCase().includes(q) ||
          (g.venue || "").toLowerCase().includes(q);
        if (!matchQ) return false;
        if (filter === "top") return (g.spread_cover_pct || 0) >= 58 || (g.favored_prob || 0) >= 70;
        if (filter === "slip") return slip.some(s => s.key.startsWith(`ncaa-${g.id}`));
        return true;
      });

      document.getElementById("visibleCount").textContent = `${filtered.length} / ${ncaaGames.length} GAMES`;

      if (!filtered.length) {
        grid.innerHTML = `<div class="empty-box">No NCAA matchups match your current filter.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(g => {
        const atsKey = `ncaa-${g.id}-ats`;
        const mlKey = `ncaa-${g.id}-ml`;
        const atsSel = slip.some(s => s.key === atsKey);
        const mlSel = slip.some(s => s.key === mlKey);
        const simMargin = Math.abs((g.home_proj || 0) - (g.away_proj || 0)).toFixed(1);
        const simFav = (g.home_proj || 0) >= (g.away_proj || 0) ? g.home_short : g.away_short;
        const hit10 = Math.max(1, Math.min(9, Math.round((g.spread_cover_pct || g.favored_prob || 55) / 10)));

        return `
          <article class="prop-card ${(atsSel || mlSel) ? 'in-slip' : ''}">
            <div class="card-header">
              <div>
                <div class="entity-title">${g.away_short} @ ${g.home_short}</div>
                <div class="entity-sub">${g.away_proj} - ${g.home_proj} • ${g.neutral ? 'NEUTRAL' : (g.venue || 'D1')}</div>
              </div>
              <div class="badges-col">
                <span class="stat-tag">SPREAD</span>
                <span class="edge-tag ${(g.edge_pts || 0) >= 2.5 ? 'hot' : ''}">+${(g.edge_pts || 0).toFixed(1)} pt edge</span>
              </div>
            </div>

            <div class="metrics-row">
              <div class="metric-col">
                <div class="metric-lbl">LINE</div>
                <div class="metric-num" style="font-size:1.1rem;">${g.market_line || 'PK'}</div>
              </div>
              <div class="metric-col">
                <div class="metric-lbl">MODEL</div>
                <div class="metric-num model-val" style="font-size:1.1rem;">${simFav} -${simMargin}</div>
              </div>
              <div class="metric-col">
                <div class="metric-lbl">HIT</div>
                <div class="metric-num hit-val">${hit10}/10</div>
              </div>
            </div>

            <div class="action-pair">
              ${g.has_line
                ? `<button class="bet-btn ${atsSel ? 'selected' : ''}" onclick="toggleSlip('${atsKey}','${g.spread_pick}',${g.spread_cover_pct})">
                    <span>+ ${g.spread_pick}</span>
                    <span class="pct">${g.spread_cover_pct.toFixed(1)}%</span>
                   </button>`
                : `<button class="bet-btn" disabled><span>Line Pending</span><span class="pct">—</span></button>`
              }
              <button class="bet-btn ${mlSel ? 'selected' : ''}" onclick="toggleSlip('${mlKey}','${g.favored_team} ML',${g.favored_prob})">
                <span>+ ${g.favored_team} ML</span>
                <span class="pct">${g.favored_prob.toFixed(1)}%</span>
              </button>
            </div>
          </article>
        `;
      }).join("");
    }
  }

  function buildNbaPropCards(players) {
    const cards = [];
    players.forEach(p => {
      (p.all_props || []).forEach(m => {
        const overProb = Number(m.prob || 50);
        const underProb = +(100 - overProb).toFixed(1);
        const edgePts = Math.abs((Number(m.proj) || 0) - (Number(m.line) || 0));
        const bestProb = Math.max(overProb, underProb);
        cards.push({
          baseKey: `nba-${p.id}-${m.stat}`,
          player: p.player,
          team: p.team,
          opponent: p.opponent,
          stat: m.stat,
          line: m.line,
          proj: m.proj,
          overProb,
          underProb,
          bestProb,
          edgePts,
          hitRate10: Math.max(1, Math.min(9, Math.round(overProb / 10))),
        });
      });
    });
    return cards.sort((a, b) => b.edgePts - a.edgePts);
  }

  async function loadAllData(force = false) {
    const bust = force ? `?t=${Date.now()}` : `?t=${Math.floor(Date.now() / 60000)}`;
    document.getElementById("lastSyncText").textContent = "Syncing live data...";

    try {
      const [ncaaRes, nbaRes] = await Promise.allSettled([
        fetch(NCAA_JSON_URL + bust),
        fetch(NBA_JSON_URL + bust)
      ]);

      if (ncaaRes.status === "fulfilled" && ncaaRes.value.ok) {
        ncaaGames = await ncaaRes.value.json();
      }
      if (nbaRes.status === "fulfilled" && nbaRes.value.ok) {
        const rawPlayers = await nbaRes.value.json();
        nbaCards = buildNbaPropCards(rawPlayers);
      }

      document.getElementById("ncaaCount").textContent = ncaaGames.length;
      document.getElementById("nbaCount").textContent = nbaCards.length;

      const ts = ncaaGames[0]?.generated_at || "Last sim today";
      document.getElementById("lastSyncText").textContent = `Last sim ${ts}`;

      updateKPIs();
      render();
    } catch (err) {
      document.getElementById("lastSyncText").textContent = "Offline mode";
    }
  }

  loadAllData();
</script>
</body>
</html>
